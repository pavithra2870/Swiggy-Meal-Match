      return `<div class="cat"><button type="button" class="cat-btn" aria-expanded="${open}" data-action="b-cat" data-key="${key}" data-fk="cat-${key}">${esc(c.cat)} (${c.items.length}) ${IC.chev}</button><div ${open ? '' : 'hidden'}>${c.items.map(it => this.menuItem(it)).join('')}</div></div>`; }).join('');
    return `<div class="screen" style="background:var(--bg)">${this.restoTop('b-back', 'Back to results')}${this.tracker()}
      <div class="scroll" id="scroll"><div class="menu-wrap" style="padding-top:8px">${this.restoInfo(r)}
      ${found ? `<div class="demo-callout found-flash" role="status"><span class="demo-label">Demo narration</span><h3>Found it: both dishes, available, one place</h3><p>It took <b>${plural(this.pages(), 'menu', 'menus')}</b>. Nothing in the results said this restaurant had both.</p>
        ${this.opts.inTab ? '<button type="button" class="btn-sec" data-app="tab" data-tab="after">Now try it with Meal Match →</button>' : ''}</div>` : ''}
      <div class="menu-lbl">— MENU —</div><button type="button" class="menu-search" data-action="toast" data-msg="Menu search isn't part of this demo. Scroll the menu.">${IC.search} Search for dishes</button>
      ${cats}</div></div>${this.beforeCartBar()}${NAVBAR}</div>`;
  }

  /* ---------- AFTER screens ---------- */
  afterSearch(){
    return this.searchScreen(`<div class="srow" style="padding-top:10px;padding-bottom:10px"><div class="sbox"><input type="search" autocomplete="off" placeholder=" " aria-label="Search for dishes and restaurants" data-action="toast" data-msg="One-dish search works as today. Try Build your meal below.">${this.rotPlaceholder()}<span class="divider"></span><button type="button" class="icon-btn mic" aria-label="Voice search" data-action="toast" data-msg="Voice search isn't part of this demo.">${IC.mic}</button></div></div>
      <button type="button" class="mm-entry" data-action="a-build" data-fk="a-build"><span class="ic">${IC.plate}</span><span><b>Build your meal</b><small>Find one restaurant that has all your dishes.</small></span><span class="new">NEW</span></button>`);
  }
  counterTxt(meal){ const r = meal.filter(m => m.req).length; return `${r} required · ${meal.length - r} optional`; }
  acItems(){ const q = norm(this.st.acQuery); if (!q) return []; return DISHES.filter(d => norm(d.name).includes(q) || d.aliases.some(x => norm(x).includes(q))).slice(0, 5); }
  acList(){
    const inMeal = new Set(this.st.meal.map(m => m.id));
    return this.acItems().map((d, i) => `<li role="none"><button type="button" role="option" aria-selected="${i === this.st.acHl}" class="${i === this.st.acHl ? 'hl' : ''}" data-action="add-dish" data-id="${d.id}" tabindex="-1"><span>${esc(d.name)}</span>${inMeal.has(d.id) ? '<span class="in dup">already in your meal</span>' : '<span class="in">+ Add</span>'}</button></li>`).join('');
  }
  afterBuilder(){
    const st = this.st, res = matchAll(st.meal, st.sort, this.data);
    const rows = st.meal.map((m, i) => `<li class="meal-row">${art(DISH[m.id].art)}<span class="nm">${esc(DISH[m.id].name)}</span>
      <span class="rq" role="group" aria-label="${esc(DISH[m.id].name)}: required or optional"><button type="button" class="req" aria-pressed="${m.req}" data-action="a-req" data-i="${i}" data-v="1" data-fk="req-${m.id}">Required</button><button type="button" class="opt" aria-pressed="${!m.req}" data-action="a-req" data-i="${i}" data-v="0" data-fk="opt-${m.id}">Optional</button></span>
      <button type="button" class="icon-btn" style="width:40px;height:40px" aria-label="Remove ${esc(DISH[m.id].name)}" data-action="a-remove" data-i="${i}" data-fk="rm-${m.id}">${IC.x}</button></li>`).join('');
    return `<div class="screen" style="background:var(--bg)"><div style="background:#fff">${STATUS}</div><div class="hdr"><button type="button" class="icon-btn" aria-label="Back to search" data-action="a-to" data-to="search" data-fk="a-back-b">${IC.back}</button><div class="ttl">Build your meal</div></div>
      <div class="scroll" id="scroll"><div class="builder">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>Your meal</h3><span class="counter" aria-live="polite">${this.counterTxt(st.meal)}</span></div>
        <p class="sub">Find one restaurant that has all your required dishes. Optional dishes are a bonus.</p>
        ${st.meal.length ? `<ul class="meal-list">${rows}</ul>` : '<p style="font-size:15px;color:#5D6066;margin:14px 0 0">No dishes yet. Add the dishes you want from one place.</p>'}
        <div class="add-row"><label for="dish-${this.uid()}">Add a dish</label>
          <div class="sbox"><input id="dish-${this.uid()}" data-dish="1" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="${!!this.acItems().length}" placeholder="e.g. masala dosa, neer dosa" value="${esc(st.acQuery)}"></div>
          <ul class="ac" data-ac="1" role="listbox" aria-label="Dish suggestions">${this.acList()}</ul><div class="ac-msg" data-acmsg="1" aria-live="polite">${esc(st.acMsg)}</div></div>
        <div class="preview" aria-live="polite">${st.meal.length ? `Right now: <b>${res.complete.length}</b> complete match${res.complete.length === 1 ? '' : 'es'} · <b>${res.partial.length}</b> partial` : ''}</div>
        <button type="button" class="btn-primary" data-action="a-results" data-fk="a-results" ${st.meal.length ? '' : 'disabled'}>Show restaurants</button></div>
        <p style="margin:0 18px 22px;font-size:13.5px;color:#5D6066">Spelling variants count as the same dish ("Sambar Vadai", "Dahi Papri Chaat"). "Medu Vada" without sambar does not count as sambar vada.</p></div>
      ${this.afterCartBar()}${NAVBAR}</div>`;
  }
  afterCard(m){
    const r = m.r, full = m.tier === 'complete';
    const li = x => { const d = DISH[x.dish];
      if (x.status === 'ok') return `<li><span class="st ${x.req ? 'ok' : 'opt'}" aria-hidden="true">✓</span><span class="dn"><b>${esc(d.name)}</b><small>${esc(x.item.n)}${x.req ? '' : ' · optional'}</small></span><span class="dp">${rupee(x.item.p)}</span></li>`;
      if (x.status === 'na') return `<li><span class="st na" aria-hidden="true">!</span><span class="dn"><b>${esc(d.name)}</b><small>Unavailable right now</small></span><span class="dp" style="color:#8A8C93">—</span></li>`;
      return `<li><span class="st ${x.req ? 'no' : 'opt'}" aria-hidden="true">✕</span><span class="dn"><b>${esc(d.name)}</b><small>Not on this menu${x.req ? '' : ' · optional'}</small></span><span class="dp" style="color:#8A8C93">—</span></li>`; };
    const rows = [...m.rows.filter(x => x.req), ...m.rows.filter(x => !x.req)];
    const optRows = m.rows.filter(x => !x.req), optFound = optRows.filter(x => x.status === 'ok');
    const cards = rows.filter(x => x.status === 'ok').map(x => this.dishCard(x.item, `<span class="matches-for">In your meal</span>`)).join('');
    return `<section class="rsec" aria-label="${esc(r.name)}, ${m.reqAvail} of ${m.reqTotal} of your dishes available">
      <div class="rhead"><div class="g"><p class="rnm">${esc(r.name)}</p>${this.rmeta(r, true)}</div>
        <button type="button" class="icon-btn" aria-label="Open ${esc(r.name)}" data-action="a-open" data-rid="${r.id}">${IC.arrow}</button></div>
      <div class="badge-row" style="display:flex;gap:8px;flex-wrap:wrap"><span class="badge ${full ? 'full' : 'part'}">${full ? '✓' : '!'} ${m.reqAvail}/${m.reqTotal} dishes available</span>${optFound.map(x => `<span class="badge opt">+ ${esc(DISH[x.dish].name)} (optional)</span>`).join('')}</div>
      <ul class="dstat" aria-label="Your dishes at ${esc(r.name)}">${rows.map(li).join('')}</ul>
      ${optRows.length ? `<p class="optline">Optional found: ${optFound.length ? optFound.map(x => esc(DISH[x.dish].name)).join(', ') : 'none'}</p>` : ''}
      ${cards ? `<div class="carousel">${cards}</div>` : ''}
      <div class="subtot"><span>Indicative subtotal<small>Available dishes, before fees &amp; offers</small></span><b>${rupee(m.subtotal)}</b></div>
      <button type="button" class="cta" data-action="a-open" data-rid="${r.id}" data-fk="a-open-${r.id}">View matching items</button></section>`;
  }
  afterResultsBody(){
    const st = this.st, res = matchAll(st.meal, st.sort, this.data), sel = st.meal.filter(m => m.req);
    if (!sel.length) return `<div class="empty" style="border-color:#E4E4EA"><h3>No dishes selected</h3><p>Tap a dish above to include it again, or add a new one.</p></div>`;
    let h = '';
    if (!res.complete.length){
      const blocking = sel.filter(m => !this.data.list.some(r => matchRestaurant(r, [m]).rows[0].status === 'ok'));
      const offer = blocking.length ? blocking : sel;
      h += `<div class="empty" role="status"><h3>No single restaurant has all ${sel.length} dishes right now</h3>
        <p>${blocking.length ? `No nearby restaurant has <b>${blocking.map(m => esc(DISH[m.id].name)).join(', ')}</b> available right now.` : 'Each dish is available somewhere, but not all together at one place right now.'}</p>
        <div class="actions">${offer.map(m => `<button type="button" class="btn-sec" data-action="a-make-opt" data-id="${m.id}" data-fk="mk-${m.id}">Leave out ${esc(DISH[m.id].name)}</button>`).join('')}
        ${res.partial.length ? `<button type="button" class="btn-sec" data-action="a-see-partial" data-fk="see-partial">See partial matches (${res.partial.length})</button>` : ''}</div></div>`;
    } else {
      h += `<div class="tier-h"><h3>Complete matches</h3><span>Every dish<br>available now</span></div>${res.complete.map(m => this.afterCard(m)).join('')}`;
    }
    if (res.partial.length) h += `<div class="tier-h" data-partial="1" tabindex="-1"><h3>Partial matches</h3><span>Missing at least<br>one dish</span></div>${res.partial.map(m => this.afterCard(m)).join('')}`;
    if (res.hidden.length) h += `<p class="hidden-note">${plural(res.hidden.length, 'restaurant', 'restaurants')} with none of your dishes ${res.hidden.length > 1 ? 'are' : 'is'} not shown.</p>`;
    return h;
  }
  afterResults(){
    const st = this.st, sel = st.meal.filter(m => m.req).length;
    const chips = st.meal.map((m, i) => `<button type="button" class="dchip" aria-pressed="${m.req}" data-action="a-flip" data-i="${i}" data-fk="flip-${m.id}" aria-label="${esc(DISH[m.id].name)}, ${m.req ? 'included' : 'left out'}. Tap to ${m.req ? 'leave it out' : 'include it'}"><span class="o" aria-hidden="true"></span>${esc(DISH[m.id].name)}</button>`).join('');
    const skel = '<div class="skel" aria-hidden="true"><div class="sk" style="width:60%;height:22px"></div><div class="sk" style="width:45%"></div><div class="sk" style="width:85%"></div><div class="sk" style="width:75%"></div><div class="sk" style="height:90px"></div></div>';
    const start = `<div class="empty" style="border-color:#E4E4EA"><h3>What do you want from one place?</h3><p>Add each dish in the search bar. Every dish you add is matched at once, so you only see restaurants that have them.</p></div>`;
    return `<div class="screen">${STATUS}
      <div class="hdr mmh"><button type="button" class="icon-btn" aria-label="Back to search" data-action="a-to" data-to="search" data-fk="a-back-r">${IC.back}</button>
        <div class="tt"><b>Meal Match</b><small>${st.meal.length ? `${sel} of ${plural(st.meal.length, 'dish', 'dishes')} selected` : 'Find one restaurant with all your dishes'}</small></div></div>
      <div class="srow mm-search"><div class="sbox">${IC.search.replace('<svg', '<svg style="width:20px;height:20px;color:#6A6D73;margin-right:8px;flex:none"')}<input id="dish-${this.uid()}" data-dish="1" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="${!!this.acItems().length}" aria-label="Add a dish" placeholder="Add a dish, e.g. sambar vada" value="${esc(st.acQuery)}">
        <ul class="ac drop" data-ac="1" role="listbox" aria-label="Dish suggestions">${this.acList()}</ul></div></div>
      <p class="mm-msg" data-acmsg="1" aria-live="polite">${esc(st.acMsg)}</p>
      ${st.meal.length ? `<div class="dishbar" role="group" aria-label="Dishes in your search. Tap to include or leave out">${chips}</div><p class="dhint">Tap a dish to include it or leave it out</p>
      <div class="filters"><div class="frow" role="group" aria-label="Sort results">${Object.entries(SORTS).map(([k, v]) => `<button type="button" class="fchip" aria-pressed="${st.sort === k}" data-action="a-sort" data-sort="${k}" data-fk="sort-${k}">${v.label}</button>`).join('')}<span class="fchip on">Veg Dishes ${IC.x}</span></div></div>` : ''}
      <div class="scroll" id="scroll" aria-busy="${st.loading}" style="background:var(--bg)"><div class="feed" style="padding-top:2px">${!st.meal.length ? start : st.loading ? '<div class="tier-h"><h3>Checking menus…</h3></div>' + skel + skel + skel : this.afterResultsBody()}</div></div>
      ${this.afterCartBar()}${NAVBAR}</div>`;
  }
  afterDetail(){
    const st = this.st, r = this.data.byId[st.detailRid], m = matchRestaurant(r, st.meal);
    let matching = '';
    [...m.rows.filter(x => x.req), ...m.rows.filter(x => !x.req)].forEach(x => {
      const d = DISH[x.dish], its = itemsFor(r, x.dish);
      if (!its.length){ matching += `<div class="miss"><span class="st ${x.req ? 'no' : 'opt'}" aria-hidden="true">✕</span><span><b>${esc(d.name)}</b> isn't on this menu${x.req ? '' : ' (optional)'}</span></div>`; return; }
      its.forEach(it => {
        const vars = it.variants ? `<div class="variants" role="group" aria-label="${esc(it.n)} size">${it.variants.map((v, vi) => `<button type="button" aria-pressed="${(st.variant[it.id] || 0) === vi}" data-action="a-variant" data-item="${it.id}" data-vi="${vi}" data-fk="var-${it.id}-${vi}">${esc(v[0])} · ${rupee(v[1])}</button>`).join('')}</div>` : '';
        matching += this.menuItem(it, `<div><span class="matches-for">Matches: ${esc(d.name)}</span></div>${vars}`);
      });
    });
    const badge = `<div style="margin-top:12px"><span class="badge ${m.tier === 'complete' ? 'full' : 'part'}">${m.tier === 'complete' ? '✓' : '!'} ${m.reqAvail}/${m.reqTotal} dishes available</span></div>`;
    return `<div class="screen" style="background:var(--bg)">${this.restoTop('a-back-detail', 'Back to Meal Match results')}
      <div class="scroll" id="scroll"><div class="menu-wrap" style="padding-top:8px">${this.restoInfo(r, badge)}
        <div style="margin-top:14px"><h3 class="sec-h">Matching your meal</h3><p class="sec-sub">Your dishes first. Availability is rechecked when you add.</p><div style="background:#fff" data-matching="1">${matching}</div></div>
        <div class="menu-lbl">— FULL MENU —</div>
        ${r.menu.map(c => `<div class="cat"><div class="cat-btn" style="cursor:default">${esc(c.cat)} (${c.items.length})</div>${c.items.map(it => this.menuItem(it)).join('')}</div>`).join('')}
      </div></div>${this.afterCartBar()}${NAVBAR}</div>`;
  }
  afterCartBar(){
    const n = this.cartCount(); if (!n || this.st.screen === 'cart') return '';
    return `<button type="button" class="cartbar" data-action="a-to" data-to="cart" data-fk="a-cart"><span>${plural(n, 'item', 'items')} added · ${rupee(this.cartTotal())}<small>from ${esc(this.data.byId[this.st.cart.rid].name)}</small></span><span class="r">View Cart ›</span></button>`;
  }
  afterCart(){
    const st = this.st, c = st.cart, n = this.cartCount(), r = c.rid ? this.data.byId[c.rid] : null;
    const lines = Object.entries(c.lines).map(([k, l]) => { const it = this.data.items[l.itemId].it, vl = it.variants ? ` (${it.variants[l.vi][0]})` : '';
      return `<div class="cart-line"><div style="display:flex;gap:10px;align-items:flex-start"><span class="veg" role="img" aria-label="Veg" style="margin-top:2px"></span><div><b>${esc(it.n)}${esc(vl)}</b><div style="font-size:14px;color:#5D6066">${rupee(this.linePrice(l))}</div></div></div>
        <div class="stepper" role="group" aria-label="${esc(it.n)} quantity"><button type="button" data-action="line-dec" data-key="${k}" aria-label="Remove one ${esc(it.n)}">−</button><span>${l.qty}</span><button type="button" data-action="line-inc" data-key="${k}" aria-label="Add one more ${esc(it.n)}">+</button></div></div>`; }).join('');
    const inCart = new Set(Object.values(c.lines).map(l => this.data.items[l.itemId].it.dish));
    const missing = st.meal.filter(m => m.req && !inCart.has(m.id));
    let check = '';
    if (st.checkout === 'checking') check = `<div class="okbox" style="background:#F4F6FD;border-color:#C3D3FB;color:#26324F" role="status">Rechecking availability with ${esc(r.name)}…<div class="sk"></div></div>`;
    else if (st.checkout === 'done'){
      const bad = Object.values(c.lines).filter(l => !this.data.items[l.itemId].it.avail);
      check = bad.length ? `<div class="warn" role="status">${bad.map(l => esc(this.data.items[l.itemId].it.n)).join(', ')} just became unavailable.</div>`
        : `<div class="okbox" role="status" data-checked="1"><b>All ${plural(n, 'item', 'items')} still available ✓</b><br>Rechecked just now. In the real product, payment would start here.</div>
           <div class="demo-callout" style="margin:12px 0 0"><span class="demo-label">Demo ends here</span><p style="margin-top:4px">No real checkout or payment in this prototype.</p>${this.opts.inTab ? '<button type="button" class="btn-sec" data-app="tab" data-tab="compare">See the comparison →</button>' : ''}</div>`;
    }
    return `<div class="screen" style="background:var(--bg)"><div style="background:#fff">${STATUS}</div><div class="hdr"><button type="button" class="icon-btn" aria-label="Back" data-action="a-cart-back" data-fk="a-back-c">${IC.back}</button><div class="ttl">Cart</div></div>
      <div class="scroll" id="scroll">${n ? `<div class="cart-card"><p class="rnm" style="font-size:20px">${esc(r.name)}</p><div class="rmeta" style="font-size:15px">${r.eta}-${r.eta + 5} mins · ${r.dist} km</div>${lines}
        <div class="subtot" style="margin:12px 0 0"><span>Item total<small>Fees &amp; offers not modelled in this demo</small></span><b>${rupee(this.cartTotal())}</b></div></div>
        <div class="cart-card"><h3 style="margin:0;font-size:17px">Your meal check</h3><ul class="checks">${st.meal.filter(m => m.req).map(m => `<li><span class="st ${inCart.has(m.id) ? 'ok' : 'no'}" aria-hidden="true">${inCart.has(m.id) ? '✓' : '✕'}</span>${esc(DISH[m.id].name)}${inCart.has(m.id) ? '' : ' <span style="color:#5D6066;font-size:13.5px">· not in cart yet</span>'}</li>`).join('')}</ul>
        ${missing.length ? `<div class="warn">Your cart doesn't include: ${missing.map(m => esc(DISH[m.id].name)).join(', ')}.</div>` : ''}${check}
        ${st.checkout === 'done' ? '' : `<button type="button" class="btn-primary" data-action="a-checkout" data-fk="a-checkout" ${st.checkout === 'checking' ? 'disabled' : ''}>Proceed to checkout</button>`}</div>`
        : `<div class="cart-card"><p>Your cart is empty.</p><button type="button" class="btn-sec" data-action="a-to" data-to="results">Back to results</button></div>`}</div>${NAVBAR}</div>`;
  }
  modal(){
    const md = this.st.modal; if (!md) return '';
    return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Item just went out of stock">
      <h3>Just went out of stock</h3><p><b>${esc(md.itemName)}</b> at ${esc(md.rName)} sold out as you added it. We rechecked: this restaurant now has <b>${md.reqAvail}/${md.reqTotal}</b> of your dishes.</p>
      ${md.alt ? `<div class="alt"><b>Next complete match: ${esc(md.alt.name)}</b><br>${md.alt.reqAvail}/${md.alt.reqTotal} dishes available · ${md.alt.eta}-${md.alt.eta + 5} mins · ${md.alt.dist} km · subtotal ${rupee(md.alt.subtotal)}</div>
        <button type="button" class="btn-primary" style="margin-top:0" data-action="md-switch" data-rid="${md.alt.id}" data-fk="md-switch">Switch to ${esc(md.alt.name)}</button>` : '<div class="warn" style="margin-top:0">No other complete match right now.</div>'}
      <button type="button" class="btn-sec" style="width:100%;margin-top:10px" data-action="md-close" data-fk="md-close">Stay here (partial)</button>
      ${md.alt ? '<p style="margin:8px 0 0;font-size:12.5px;color:#5D6066">Switching clears your current cart.</p>' : ''}</div></div>`;
  }

  /* ---------- render ---------- */
  screenKey(){ const s = this.st; return s.screen + (s.screen === 'menu' ? s.menuRid : s.screen === 'detail' ? s.detailRid : ''); }
  render(){
    const ae = document.activeElement, inPhone = ae && this.root.contains(ae);
    const fk = inPhone && ae.dataset ? ae.dataset.fk : null, inputSel = inPhone && ae.tagName === 'INPUT' ? ae.id : null;
    const sc = this.sh.querySelector('#scroll'); if (sc && this.lastKey) this.scrollMem[this.lastKey] = sc.scrollTop;
    const caro = []; this.sh.querySelectorAll('.carousel').forEach(c => caro.push(c.scrollLeft));
    const html = this.kind === 'before'
      ? ({search:() => this.beforeSearch(), results:() => this.beforeResults(), menu:() => this.beforeMenu()})[this.st.screen]()
      : ({search:() => this.afterSearch(), builder:() => this.afterBuilder(), results:() => this.afterResults(), detail:() => this.afterDetail(), cart:() => this.afterCart()})[this.st.screen]();
    this.sh.innerHTML = html + (this.kind === 'after' ? this.modal() : '') + (this.toast ? `<div class="toast" role="status">${esc(this.toast)}</div>` : '');
    const key = this.screenKey(), sc2 = this.sh.querySelector('#scroll');
    if (sc2) sc2.scrollTop = this.scrollMem[key] || 0;
    if (key === this.lastKey) this.sh.querySelectorAll('.carousel').forEach((c, i) => { if (caro[i]) c.scrollLeft = caro[i]; });
    this.lastKey = key;
    if (this.st.modal){ const b = this.sh.querySelector('.sheet button'); if (b && !this.player) b.focus({preventScroll:true}); }
    else if (this.st.focusPartial && !this.st.loading){ this.st.focusPartial = false; const ph = this.sh.querySelector('[data-partial]'); if (ph && sc2){ sc2.scrollTop = ph.offsetTop - 8; ph.focus({preventScroll:true}); } }
    else if (inputSel){ const el = this.sh.querySelector('#' + CSS.escape(inputSel)); if (el){ el.focus({preventScroll:true}); const v = el.value; try { el.setSelectionRange(v.length, v.length); } catch(e){} } }
    else if (fk){ const el = this.sh.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el) el.focus({preventScroll:true}); }
    if (this.kind === 'after' && this.st.screen === 'results' && !this.st.loading && this.m.start && !this.m.end){
      const sel = this.st.meal.filter(m => m.req);
      if (sel.length >= 2 && matchAll(this.st.meal, this.st.sort, this.data).complete.length){ this.endClock(); announce('First match found'); }
    }
    if (this.opts.onUpdate) this.opts.onUpdate(this);
  }
  showToast(msg){ this.toast = msg; announce(msg); this.render(); clearTimeout(this.tt); this.tt = setTimeout(() => { this.toast = null; this.render(); }, 2400); this.timers.push(this.tt); }
  recompute(){
    if (this.st.screen !== 'results') return this.render();
    this.scrollMem[this.screenKey()] = 0; const sc = this.sh.querySelector('#scroll'); if (sc) sc.scrollTop = 0;
    if (this.fast){ this.st.loading = false; this.render(); return; }
    this.st.loading = true; this.render();
    clearTimeout(this.lt); this.lt = setTimeout(() => { this.st.loading = false; this.render(); }, 550); this.timers.push(this.lt);
  }
  renderAc(){
    const l = this.sh.querySelector('[data-ac]'), m = this.sh.querySelector('[data-acmsg]'), i = this.sh.querySelector('[data-dish]');
    if (l) l.innerHTML = this.acList(); if (m) m.textContent = this.st.acMsg; if (i) i.setAttribute('aria-expanded', !!this.acItems().length);
  }

  /* ---------- actions ---------- */
  add(itemId, delta){
    const {it, r} = this.data.items[itemId], st = this.st, c = st.cart;
    if (delta > 0 && this.kind === 'after' && it.flipOnAdd && !st.flipped && !this.opts.noFlip){
      it.avail = false; st.flipped = true;
      const m = matchRestaurant(r, st.meal), alt = matchAll(st.meal, st.sort, this.data).complete.find(x => x.r.id !== r.id);
      st.modal = {itemName:it.n, rName:r.name, reqAvail:m.reqAvail, reqTotal:m.reqTotal, alt: alt ? {id:alt.r.id, name:alt.r.name, eta:alt.r.eta, dist:alt.r.dist, reqAvail:alt.reqAvail, reqTotal:alt.reqTotal, subtotal:alt.subtotal} : null};
      announce(`${it.n} just went out of stock`); return this.render();
    }
    if (delta > 0 && !it.avail) return this.showToast(`${it.n} is unavailable right now.`);
    let switched = false;
    if (delta > 0 && c.rid && c.rid !== r.id){ c.lines = {}; switched = true; }
    if (delta > 0) c.rid = r.id;
    const vi = (this.kind === 'after' && it.variants) ? (st.variant[it.id] || 0) : 0;
    let key = `${itemId}|${vi}`;
    if (delta < 0 && !c.lines[key]) key = Object.keys(c.lines).find(k => c.lines[k].itemId === itemId);
    if (!key) return this.render();
    const line = c.lines[key] || (c.lines[key] = {itemId, vi, qty:0});
    line.qty += delta; if (line.qty <= 0) delete c.lines[key];
    if (!Object.keys(c.lines).length) c.rid = null;
    if (this.kind === 'after') st.checkout = null;
    if (switched) this.showToast(`Cart switched to ${r.name}`); else this.render();
  }
  addDish(id){
    const st = this.st;
    if (!id){ st.acMsg = st.acQuery ? `No dish called “${st.acQuery}” in this demo’s list.` : ''; return this.renderAc(); }
    if (st.meal.some(m => m.id === id)){ st.acMsg = `${DISH[id].name} is already in your meal.`; return this.renderAc(); }
    st.meal.push({id, req:true}); st.acQuery = ''; st.acHl = 0; st.acMsg = '';
    announce(`Added ${DISH[id].name}`); this.recompute();
    const inp = this.sh.querySelector('[data-dish]'); if (inp && !this.player) inp.focus();
  }
  act(a, d){
    const st = this.st;
    const A = {
      toast: () => this.showToast(d.msg),
      inc: () => this.add(d.item, 1), dec: () => this.add(d.item, -1),
      'line-inc': () => { const l = st.cart.lines[d.key]; st.variant[l.itemId] = l.vi; this.add(l.itemId, 1); },
      'line-dec': () => { const l = st.cart.lines[d.key]; l.qty--; if (l.qty <= 0) delete st.cart.lines[d.key]; if (!Object.keys(st.cart.lines).length) st.cart.rid = null; st.checkout = null; this.render(); },
      'b-search': () => this.doSearch(),
      'b-clear': () => { st.screen = 'search'; st.query = ''; this.render(); },
      'b-tab': () => { st.tab = d.tab; this.render(); },
      'b-chip': () => { st.chips[d.key] = !st.chips[d.key]; this.showToast('Filters are visual only in this demo; results stay the same.'); },
      'b-open': () => {
        st.menuRid = d.rid; st.screen = 'menu'; this.scrollMem['menu' + d.rid] = 0;
        if (!st.opened.includes(d.rid)) st.opened.push(d.rid);
        if (!st.found && matchRestaurant(this.data.byId[d.rid], TASK_MEAL).tier === 'complete'){ st.found = d.rid; this.endClock(); announce('Found a restaurant with both dishes'); }
        this.render();
      },
      'b-back': () => { st.screen = 'results'; this.render(); },
      'b-cat': () => { st.collapsed[d.key] = !st.collapsed[d.key]; this.render(); },
      'a-build': () => { this.startClock(); st.screen = 'results'; st.loading = false; this.render(); },
      'a-to': () => { st.screen = d.to; if (d.to === 'results') st.loading = false; this.render(); },
      'a-results': () => { st.screen = 'results'; this.scrollMem.results = 0; this.recompute(); },
      'a-req': () => { st.meal[+d.i].req = d.v === '1'; this.render(); },
      'a-flip': () => { const m = st.meal[+d.i]; m.req = !m.req; announce(`${DISH[m.id].name} ${m.req ? 'included' : 'left out'}`); this.recompute(); },
      'a-remove': () => { const m = st.meal.splice(+d.i, 1)[0]; st.acMsg = `Removed ${DISH[m.id].name}.`; this.render(); },
      'add-dish': () => this.addDish(d.id),
      'a-sort': () => { st.sort = d.sort; this.recompute(); },
      'a-make-opt': () => { const m = st.meal.find(x => x.id === d.id); if (m) m.req = false; this.recompute(); },
      'a-see-partial': () => { st.focusPartial = true; this.render(); },
      'a-open': () => {
        st.detailRid = d.rid; st.screen = 'detail'; this.scrollMem['detail' + d.rid] = 0;
        if (!st.opened.includes(d.rid)) st.opened.push(d.rid);
        this.render();
      },
      'a-back-detail': () => { st.screen = 'results'; st.loading = false; this.render(); },
      'a-variant': () => { st.variant[d.item] = +d.vi; this.render(); },
      'a-cart-back': () => { if (st.cart.rid){ st.screen = 'detail'; st.detailRid = st.cart.rid; } else st.screen = 'results'; if (st.checkout === 'done') st.checkout = null; this.render(); },
      'a-checkout': () => { if (this.fast){ st.checkout = 'done'; return this.render(); } st.checkout = 'checking'; this.render(); this.later(() => { st.checkout = 'done'; this.render(); }, 1000); },
      'md-switch': () => { st.modal = null; st.cart = {rid:null, lines:{}}; this.act('a-open', d); },
      'md-close': () => { st.modal = null; this.render(); }
    };
    if (A[a]) A[a]();
  }
  onClick(e){
    const hit = e.target.closest('button,input');
    if (e.isTrusted && this.player) this.player.cancel(true);
    const el = e.target.closest('[data-action]');
    if (this.kind === 'before' && e.target.matches('[data-q]')){
      this.startClock();
      if (!e.target.value && !this.player){ e.target.value = BEFORE_QUERY; this.st.query = BEFORE_QUERY; }
    }
    if (el && el.dataset.action === 'a-build') this.startClock();
    if (hit && this.m.start && !this.m.end) this.m.taps++;
    if (!el || el.disabled){ if (this.opts.onUpdate) this.opts.onUpdate(this); return; }
    if (el.tagName !== 'INPUT') e.preventDefault();
    this.act(el.dataset.action, el.dataset);
  }
  onSubmit(e){ e.preventDefault(); }
  doSearch(){
    const v = this.sh.querySelector('[data-q]').value.trim();
    if (!v) return this.showToast('Type something or tap the box to pre-fill the query.');
    this.startClock(); this.st.query = v; this.st.screen = 'results'; this.st.tab = 'dishes'; this.scrollMem.results = 0;
    this.render();
  }
  onInput(e){
    if (e.target.matches('[data-q]')) this.st.query = e.target.value;
    if (e.target.matches('[data-dish]')){ this.st.acQuery = e.target.value; this.st.acHl = 0; this.st.acMsg = ''; this.renderAc(); }
  }
  onKey(e){
    if (e.key === 'Escape' && this.st.modal){ this.st.modal = null; this.render(); return; }
    if (e.key === 'Enter' && e.target.matches('[data-q]')){ e.preventDefault(); this.doSearch(); return; }
    if (!e.target.matches('[data-dish]')) return;
    const items = this.acItems();
    if (e.key === 'ArrowDown' && items.length){ e.preventDefault(); this.st.acHl = (this.st.acHl + 1) % items.length; this.renderAc(); }
    else if (e.key === 'ArrowUp' && items.length){ e.preventDefault(); this.st.acHl = (this.st.acHl - 1 + items.length) % items.length; this.renderAc(); }
    else if (e.key === 'Enter'){ e.preventDefault(); this.addDish(items.length ? items[this.st.acHl].id : null); }
  }
}

/* =========================================================
   PLAYER: scripted user-POV walkthrough driving a Phone.
   A finger moves to real elements, presses, types and scrolls;
   every action goes through the same handlers a real tap hits.
   ========================================================= */
class Player {
  constructor(phone, script, hooks = {}){
    this.ph = phone; this.script = script; this.hooks = hooks;
    this.paused = false; this.cancelled = false; this.done = false; this.step = 0;
  }
  get speed(){ return APP.speed; }
  async run(){
    this.ph.player = this; this.ph.m.scripted = true; this.started = true; this.pt = this.pt || 0; this.durs = [];
    try {
      for (this.step = 0; this.step < this.script.length; this.step++){
        if (this.cancelled) return;
        this.ff = this.step < (this.ffUntil || 0); this.ph.fast = this.ff;
        if (this.ff) this.hideFinger();
        this.stepPt = this.pt;
        const [cap, fn] = this.script[this.step];
        this.say(cap);
        await fn(this);
        this.durs[this.step] = this.pt - this.stepPt;
      }
      this.ff = false; this.ph.fast = false;
      if (this.cancelled) return;
      this.done = true; this.hideFinger();
      if (this.ph.player === this) this.ph.player = null;
      if (this.hooks.onDone) this.hooks.onDone(this);
    } catch (err){
      if (!this.cancelled) console.warn('walkthrough stopped:', err);
    } finally {
      if (this.ph.player === this) this.ph.player = null;
    }
  }
  say(text){ if (this.hooks.onCaption) this.hooks.onCaption(text, this.step + 1, this.script.length, this); }
  mark(text){ if (this.hooks.onMark) this.hooks.onMark(text); }
  event(name){ if (this.hooks.onEvent) this.hooks.onEvent(name, this); }
  note(type, text){ if (this.hooks.onNote) this.hooks.onNote(type, text); if (this.ph.opts.inTab){ const f = this.fpos || {x:180, y:300}; this.ph.bubble(type, text, f.x, f.y); } }
  async highlight(sel, ms){
    const el = await this.find(sel); await this.ensureVisible(el);
    const p = this.rel(el); this.moveFinger(p.x + 70, p.y + 46, 600);
    el.classList.add('spot'); await this.wait(ms);
    const live = this.ph.sh.querySelector(sel); if (live) live.classList.remove('spot');
  }
  pause(){ this.paused = true; }
  resume(){ this.paused = false; if (this._res){ const r = this._res; this._res = null; r(); } }
  cancel(byUser){
    if (this.cancelled || this.done) return;
    this.cancelled = true; this.paused = false; this.hideFinger();
    if (this._res){ this._res(); this._res = null; }
    if (this.ph.player === this) this.ph.player = null;
    if (this.hooks.onCancel) this.hooks.onCancel(this, byUser);
  }
  async gate(){ while (this.paused && !this.cancelled && !this.ff) await new Promise(r => this._res = r); if (this.cancelled) throw new Error('cancelled'); }
  async wait(ms){
    if (this.ff){ this.pt += ms; const m = this.ph.m; if (m.start && !m.end) m.virt += ms; await sleep(0); if (this.cancelled) throw new Error('cancelled'); return; }
    let left = ms;
    while (left > 0){
      await this.gate();
      const chunk = Math.min(left, 60);
      await sleep(chunk / this.speed);
      left -= chunk; this.pt += chunk;
      const m = this.ph.m; if (m.start && !m.end) m.virt += chunk;
    }
    await this.gate();
  }
  hideFinger(){ this.ph.finger.classList.remove('on', 'press', 'drag'); }
  moveFinger(x, y, ms = 450){
    if (this.ff){ this.fpos = {x, y}; return; }
    const f = this.ph.finger;
    f.style.transitionDuration = reduceMotion() ? '0ms, 0ms' : `${Math.round(ms / this.speed)}ms, 250ms`;
    f.classList.add('on'); f.style.transform = `translate(${x}px, ${y}px)`; this.fpos = {x, y};
  }
  async find(sel, timeout = 4000){
    let t = 0;
    while (t < timeout){ const el = this.ph.sh.querySelector(sel); if (el) return el; await this.wait(60); t += 60; }
    throw new Error('not found: ' + sel);
  }
  rel(el){
    const root = this.ph.root, pr = root.getBoundingClientRect(), r = el.getBoundingClientRect();
    const k = pr.width / (root.offsetWidth || pr.width) || 1, b = root.clientLeft || 0;
    return {x: (r.left - pr.left) / k - b + r.width / k / 2, y: (r.top - pr.top) / k - b + r.height / k / 2};
  }
  async animScroll(box, prop, to, ms){
    const from = box[prop], dur = ms / this.speed;
    if (this.ff){ box[prop] = to; this.pt += ms; const m = this.ph.m; if (m.start && !m.end) m.virt += ms; return; }
    if (reduceMotion() || Math.abs(to - from) < 2){ box[prop] = to; return; }
    let t0 = null;
    await new Promise(res => { const tick = now => {
      if (this.cancelled) return res();
      if (t0 === null) t0 = now;
      if (this.paused){ t0 += 16; requestAnimationFrame(tick); return; }
      const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      box[prop] = from + (to - from) * e; if (k < 1) requestAnimationFrame(tick); else res(); };
      requestAnimationFrame(tick); });
    this.pt += ms; const m = this.ph.m; if (m.start && !m.end) m.virt += ms;
  }
  async ensureVisible(el){
    const box = el.closest('.scroll'), car = el.closest('.carousel, .hero-row, .frow');
    if (box){
      const br = box.getBoundingClientRect(), r = el.getBoundingClientRect(), k = (br.height / box.clientHeight) || 1;
      if (r.top < br.top + 10 || r.bottom > br.bottom - 10){
        const target = Math.max(0, Math.min(box.scrollHeight - box.clientHeight, box.scrollTop + ((r.top - br.top) - br.height * 0.38) / k));
        await this.swipe(box, target - box.scrollTop);
      }
    }
    if (car){
      const cr = car.getBoundingClientRect(), r = el.getBoundingClientRect(), kx = (cr.width / car.clientWidth) || 1;
      if (r.left < cr.left + 4 || r.right > cr.right - 4){
        const dx = (r.left - cr.left - 20) / kx, p = this.rel(car), pw = this.ph.root.clientWidth;
        this.moveFinger(pw * 0.78, p.y, 300); await this.wait(320);
        this.ph.finger.classList.add('drag'); this.moveFinger(pw * 0.25, p.y, 500);
        await this.animScroll(car, 'scrollLeft', car.scrollLeft + dx, 500);
        this.ph.finger.classList.remove('drag'); await this.wait(150);
      }
    }
  }
  async swipe(box, dy){
    if (Math.abs(dy) < 2) return;
    const pw = this.ph.root.clientWidth, c = this.rel(box), h = box.clientHeight;
    const startY = dy > 0 ? c.y + h * 0.26 : c.y - h * 0.26, endY = dy > 0 ? c.y - h * 0.2 : c.y + h * 0.2;
    const dur = Math.min(900, 380 + Math.abs(dy) * 0.6);
    this.moveFinger(pw * 0.62, startY, 300); await this.wait(330);
    this.ph.finger.classList.add('drag'); this.moveFinger(pw * 0.62, endY, dur);
    const to = Math.max(0, Math.min(box.scrollHeight - box.clientHeight, box.scrollTop + dy));
    await this.animScroll(box, 'scrollTop', to, dur);
    this.ph.finger.classList.remove('drag');
    await this.wait(120);
  }
  async scroll(dy){ await this.gate(); const box = this.ph.sh.querySelector('#scroll'); if (box) await this.swipe(box, dy); }
  async scrollToEl(sel){ const el = await this.find(sel); await this.ensureVisible(el); }
  async tap(sel){
    const el = await this.find(sel);
    await this.ensureVisible(el);
    const p = this.rel(el);
    this.moveFinger(p.x, p.y, 480); await this.wait(520);
    const f = this.ph.finger; f.classList.remove('press'); void f.offsetWidth; f.classList.add('press');
    await this.wait(170);
    const live = this.ph.sh.contains(el) ? el : await this.find(sel);
    if (live.tagName === 'INPUT') live.focus({preventScroll:true});
    live.click();
    await this.wait(200); f.classList.remove('press');
    await this.wait(260);
  }
  async type(sel, text){
    for (const ch of text){
      await this.wait(ch === ' ' ? 110 : 85);
      const el = await this.find(sel);
      el.value += ch; el.dispatchEvent(new Event('input', {bubbles:true}));
    }
  }
  async clear(sel){ const el = await this.find(sel); el.value = ''; el.dispatchEvent(new Event('input', {bubbles:true})); await this.wait(200); }
}

/* ----- YouTube-style seek bar: one segment per walkthrough step ----- */
const EST_B = [6000, 5400, 8700, 8800, 8800, 10300], EST_A = [3550, 3650, 4150, 5200, 4150, 3850, 3050, 3150];   // step lengths in ms at 1×, measured from the scripts
function buildTimeline(){
  const bar = document.getElementById('tlbar'); if (!bar) return;
  const S = APP.segs = [...SCRIPT_BEFORE.map((x, i) => ({a:'b', cap:x[0], est:EST_B[i] || 3000})), ...SCRIPT_AFTER_TASK.map((x, i) => ({a:'a', cap:x[0], est:EST_A[i] || 3000}))];
  APP.totalEst = S.reduce((t, x) => t + x.est, 0);
  bar.setAttribute('aria-valuemax', S.length - 1);
  bar.innerHTML = S.map((x, g) => `<span class="sg ${x.a}${x.a === 'a' && S[g - 1] && S[g - 1].a === 'b' ? ' first' : ''}" style="flex:${x.est} 1 0"><i></i></span>`).join('') + '<span class="tl-knob" id="tlknob"></span><span class="tl-tip" id="tltip"></span>';
  const segAt = cx => { const els = [...bar.querySelectorAll('.sg')]; for (let i = 0; i < els.length; i++){ if (cx <= els[i].getBoundingClientRect().right + 1) return i; } return els.length - 1; };
  const tip = cx => {
    const g = segAt(cx), x = APP.segs[g], br = bar.getBoundingClientRect(), t = document.getElementById('tltip');
    t.innerHTML = `<b>${x.a === 'b' ? 'Today' : 'Meal Match'} · ${fmtTime(APP.segs.slice(0, g).reduce((s, y) => s + y.est, 0))}</b>${esc(x.cap)}`;
    t.style.left = Math.max(120, Math.min(br.width - 120, cx - br.left)) + 'px';
    bar.querySelectorAll('.sg').forEach((el, i) => el.classList.toggle('hov', i === g));
    return g;
  };
  let dragging = false;
  bar.addEventListener('pointerdown', e => { dragging = true; bar.setPointerCapture(e.pointerId); bar.classList.add('drag'); tip(e.clientX); });
  bar.addEventListener('pointermove', e => tip(e.clientX));
  bar.addEventListener('pointerup', e => { if (!dragging) return; dragging = false; bar.classList.remove('drag'); seekCompare(segAt(e.clientX)); });
  bar.addEventListener('pointerleave', () => { if (!dragging) bar.querySelectorAll('.sg.hov').forEach(el => el.classList.remove('hov')); });
  bar.addEventListener('keydown', e => {
    const {g, frac} = curPos(), n = APP.segs.length;
    if (e.key === 'ArrowRight'){ e.preventDefault(); seekCompare(Math.min(n - 1, g + 1)); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); seekCompare(Math.max(0, frac > 0.2 ? g : g - 1)); }
    else if (e.key === 'Home'){ e.preventDefault(); seekCompare(0); }
    else if (e.key === 'End'){ e.preventDefault(); seekCompare(n - 1); }
  });
}
function curPos(){
  const pb = APP.players.cb, pa = APP.players.ca, NB = SCRIPT_BEFORE.length, S = APP.segs || [];
  const f = (p, est) => Math.max(0, Math.min(1, (p.pt - p.stepPt) / est));
  if (!pb || !pb.started) return {g:0, frac:0};
  if (!pb.done) return {g:pb.step, frac:f(pb, S[pb.step].est)};
  if (!pa || !pa.started) return {g:NB, frac:0};
  if (!pa.done) return {g:NB + pa.step, frac:f(pa, S[NB + pa.step].est)};
  return {g:S.length, frac:0};
}
function updTimeline(){
  const bar = document.getElementById('tlbar'); if (!bar || !APP.segs) return;
  const {g, frac} = curPos(), els = bar.querySelectorAll('.sg'), S = APP.segs;
  els.forEach((el, i) => { el.firstChild.style.width = (i < g ? 100 : i === g ? frac * 100 : 0) + '%'; });
  const k = document.getElementById('tlknob');
  if (k && els.length){ const el = els[Math.min(g, els.length - 1)]; k.style.left = (g >= els.length ? el.offsetLeft + el.offsetWidth : el.offsetLeft + el.offsetWidth * frac) + 'px'; }
  const done = S.slice(0, Math.min(g, S.length)).reduce((t, x) => t + x.est, 0) + (g < S.length ? frac * S[g].est : 0);
  const tt = document.getElementById('tltime'); if (tt) tt.textContent = `${fmtTime(done)} / ${fmtTime(APP.totalEst)}`;
  bar.setAttribute('aria-valuenow', Math.min(g, S.length - 1)); bar.setAttribute('aria-valuetext', S[Math.min(g, S.length - 1)].cap);
}
function seekCompare(g){ startCompare(!APP.paused, g); }
function statCard(k){

  const d = (x, y, f) => good && b ? `<em>${x - y <= 0 ? '−' : '+'}${f(Math.abs(x - y))}</em>` : '';
  const cell = (val, lbl, delta) => `<div><b>${val}</b><span>${lbl}</span>${delta}</div>`;
  const el = document.getElementById('met-' + k); if (!el) return;

    ${cell(fmtTime(s.time), 'time to first match', d(s.time, b ? b.time : 0, ms => fmtTime(ms)))}
    ${cell(s.taps, 'taps', d(s.taps, b ? b.taps : 0, n => n))}
    ${cell(s.pages, 'menus opened', d(s.pages, b ? b.pages : 0, n => n))}</div>
    <p>${good ? 'The match is on the results. No menu checking.' : `${plural(Math.max(0, s.pages - 1), 'dead end', 'dead ends')} before a match: missing dishes and an unavailable chaat.`}</p></div>`;
}
// scale both phones so the bar + phones (with info beside them) fit one laptop screen
function fitCompare(){
  if (APP.tab !== 'compare') return;
  const top = document.querySelector('.cmp-top'), mobile = window.innerWidth <= 900;
  let sc = 1;
  if (!mobile && top){
    const H = window.innerHeight - top.offsetHeight - 12 - 24;
    const W = stage.clientWidth - 40, scW = (W - 2 * 236 - 2 * 14 - 28) / (2 * 372);

    if (mobile){ host.style.width = host.style.height = ''; ph.style.transform = ''; ph.style.transformOrigin = ''; }
    else { host.style.width = (372 * sc) + 'px'; host.style.height = (720 * sc) + 'px'; ph.style.transform = `scale(${sc})`; ph.style.transformOrigin = '0 0'; }
  });
  updTimeline();
}
function focusCompare(){

  const host = document.getElementById('host-' + APP.tab), ph = host && host.querySelector('.phone'); if (!ph) return;
  const col = host.parentElement, mobile = window.innerWidth <= 900;
  if (mobile){ host.style.width = host.style.height = ''; ph.style.transform = ''; ph.style.transformOrigin = ''; col.style.removeProperty('--cw'); return; }
  const RESERVE = 16 + 110 + 12;                 // top gap + caption area + bottom gap
  const sc = Math.max(0.5, Math.min(1, (window.innerHeight - RESERVE) / 844));
  host.style.width = (390 * sc) + 'px'; host.style.height = (844 * sc) + 'px';
  ph.style.transform = `scale(${sc})`; ph.style.transformOrigin = '0 0';
  col.style.setProperty('--cw', Math.max(320, 390 * sc) + 'px');
}
function focusTab(){
  const g = document.querySelector('.stage-grid'); if (!g) return;
  const y = g.getBoundingClientRect().top + window.scrollY - 16;
  window.scrollTo({top: Math.max(0, y), behavior: reduceMotion() ? 'auto' : 'smooth'});
}
window.addEventListener('resize', () => { clearTimeout(APP.rt); APP.rt = setTimeout(() => { fitCompare(); fitTab(); }, 120); });
// wait that respects pause and speed; returns false if this run was replaced
async function appWait(ms, token){
  let left = ms;
  while (left > 0){ if (token !== APP.cmpToken) return false; if (APP.paused){ await sleep(80); continue; } await sleep(60 / APP.speed); left -= 60; }
  return token === APP.cmpToken;
}
async function startCompare(autoplay, seekStep = 0){
  const token = APP.cmpToken = (APP.cmpToken || 0) + 1;
  Object.values(APP.players).forEach(p => p && p.cancel(false));
  const {cb, ca} = APP.phones; cb.reset(); ca.reset(); APP.scripted = {}; APP.statShown = {};
  ['cb', 'ca'].forEach(k => { document.getElementById('rail-' + k).innerHTML = ''; document.getElementById('wrap-' + k).classList.remove('faded'); const d = document.getElementById('dim-' + k); d.className = 'dimmer off'; d.innerHTML = ''; });
  document.getElementById('summary').innerHTML = '';
  document.getElementById('run-wb').textContent = 'Playing…'; document.getElementById('run-wa').textContent = 'Waiting…';
  const cp = document.getElementById('cpause');
  APP.paused = !autoplay; setPauseBtn();
  const runRow = (k, s) => { document.getElementById(k === 'cb' ? 'run-wb' : 'run-wa').innerHTML = `<span class="run-lbl">scripted walkthrough</span><br>${fmtTime(s.time)} to first match · ${s.taps} taps · ${plural(s.pages, 'menu', 'menus')} opened`; };
  const mk = (k, ph, script, extra) => new Player(ph, script, Object.assign({
    onCaption: (t, n, tot) => { setCaption(k, t, n, tot); updProgress(); },
    onMark: t => addRail(k, t, k === 'cb'),
    onCancel: (p, byUser) => { if (byUser) setCaption(k, 'You took over this phone. Use Replay to restart the story.', 0, 0, 'idle'); }
  }, extra));
  const pb = mk('cb', cb, SCRIPT_BEFORE, {
    onDone: () => { const s = snapshot(cb); APP.scripted.cb = s; setCaption('cb', `Found the one restaurant with both dishes, after ${plural(s.pages, 'menu', 'menus')}.`, 0, 0, 'done'); statCard('cb'); runRow('cb', s); updProgress(); }
  });
  const pa = mk('ca', ca, SCRIPT_AFTER_TASK, {
    onEvent: (name, p) => { if (name !== 'solved') return;
      const s = snapshot(ca); APP.scripted.ca = s; statCard('ca'); runRow('ca', s); maybeSummary();
      setPhase(3);
      if (!p.ff){ setDim('ca', true, 'Act 3', 'Here’s more you can do', 'Refine your meal anytime'); appWait(2600, token).then(ok => { if (ok) setDim('ca', false); }); }
    },
    onDone: () => { setCaption('ca', 'Refine anytime: tap any dish to leave it out or bring it back.', 0, 0, 'done'); setPhase('end'); updProgress(); }
  });
  APP.players = {cb:pb, ca:pa}; cb.m.scripted = ca.m.scripted = true;
  const NB = SCRIPT_BEFORE.length; pb.ffUntil = Math.min(seekStep, NB); pa.ffUntil = Math.max(0, seekStep - NB);
  if (!autoplay){ pb.pause(); pa.pause(); }
  setCaption('cb', 'Ready: the task is sambar vada + dahi papdi chaat from one restaurant.', 0, 0, 'idle');
  setCaption('ca', 'Plays after Swiggy today finishes.', 0, 0, 'idle');
  updCmpMetrics('cb', cb); updCmpMetrics('ca', ca);
  setPhase(1); setDim('ca', true, 'Up next', 'Same task with Meal Match', 'Plays after the current journey');
  fitCompare(); updTimeline();
  if (!seekStep){ setTimeout(focusCompare, 250); if (!(await appWait(1300, token))) return; }
  await pb.run();
  if (token !== APP.cmpToken || pb.cancelled) return;
  problemOverlay(seekStep < NB);
  if (seekStep < NB){
    setPhase('gap');
    if (!(await appWait(4200, token))) return;
    document.getElementById('wrap-cb').classList.add('faded');
    setDim('ca', true, 'Act 2', 'Now, with Meal Match', 'Same two dishes');
    if (!(await appWait(1500, token))) return;
  } else document.getElementById('wrap-cb').classList.add('faded');
  setDim('ca', false); setPhase(2);
  await pa.run();
}
function setPauseBtn(){ const b = document.getElementById('cpause'); if (!b) return; b.innerHTML = APP.paused ? IC.play : IC.pause; b.setAttribute('aria-label', APP.paused ? 'Play' : 'Pause'); }
function problemOverlay(animate){
  const d = document.getElementById('dim-cb'), s = APP.scripted.cb; if (!d || !s) return;
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h17M14 5.5 20.5 12 14 18.5"/></svg>';
  d.className = 'dimmer prob';
  d.innerHTML = `<div class="pcard" role="status"><div class="ey"><span class="x" aria-hidden="true">✕</span>The problem today</div>
    <div class="nums"><div><b data-to="${s.time}" data-kind="t">${fmtTime(s.time)}</b><span>to first match</span></div><div><b data-to="${s.taps}">${s.taps}</b><span>taps</span></div><div><b data-to="${s.pages}">${s.pages}</b><span>menus opened</span></div></div>
    <p>${plural(Math.max(0, s.pages - 1), 'dead end', 'dead ends')} before a single match.</p>
    <button type="button" class="nextcta" data-app="seekafter">Now with Meal Match ${arrow}</button></div>`;
  if (!animate || reduceMotion()) return;
  const t0 = performance.now(), els = d.querySelectorAll('[data-to]');
  const tick = now => { const k = Math.min(1, (now - t0 - 250) / 900); if (k < 0) return requestAnimationFrame(tick);
    els.forEach(el => { const v = +el.dataset.to * (1 - Math.pow(1 - k, 3)); el.textContent = el.dataset.kind === 't' ? fmtTime(v) : Math.round(v); });
    if (k < 1) requestAnimationFrame(tick); };
  els.forEach(el => el.textContent = el.dataset.kind === 't' ? '0:00' : '0');
  requestAnimationFrame(tick);
}
function maybeSummary(){
  const b = APP.scripted.cb, a = APP.scripted.ca; if (!b || !a) return;
  document.getElementById('summary').innerHTML = `<section class="summary" aria-label="Walkthrough summary"><h2>Same task, two journeys</h2>
    <p>Counted up to the first restaurant with both dishes: <b>${fmtTime(b.time)} → ${fmtTime(a.time)}</b>, <b>${b.taps} → ${a.taps} taps</b>, <b>${plural(b.pages, 'menu', 'menus')} → ${plural(a.pages, 'menu', 'menus')}</b> opened.</p>
    <div class="sum-grid"><div class="sum-card"><b>Swiggy today</b><ul><li>Coverage only visible inside each menu</li><li>${plural(Math.max(0, b.pages - 1), 'dead end', 'dead ends')}: missing dishes, an unavailable chaat</li></ul></div>
    <div class="sum-card" style="background:#F2FAF6"><b>With Meal Match</b><ul><li>“2/2 dishes available” right on the results</li><li>Add, leave out or bring back any dish, anytime</li></ul></div></div>
    <p class="cmp-foot" style="margin-top:10px">Scripted walkthrough with demo data; times at 1× speed. Not real-world measurements.</p></section>`;
}

/* ----- global controls ----- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-app]'); if (!b) return;
  const a = b.dataset.app, kind = APP.tab;
  if (a === 'tab'){ e.preventDefault(); APP.tab = b.dataset.tab; window.scrollTo({top:0}); mount(); return; }
  if (a === 'reset'){ APP.manual = {before:null, after:null}; window.scrollTo({top:0}); mount(); announce('Reset. Replaying the walkthrough.'); return; }
  if (a === 'speed'){ APP.speed = +b.dataset.v; document.querySelectorAll('[data-app="speed"]').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (a === 'cpause'){
    const ps = Object.values(APP.players).filter(p => p && !p.done && !p.cancelled);
    if (!ps.length && !APP.paused){ startCompare(true); return; }
    APP.paused = !APP.paused; ps.forEach(p => APP.paused ? p.pause() : p.resume());
    setPauseBtn(); return;
  }
  if (a === 'creplay'){ startCompare(true); return; }
  if (a === 'seekafter'){ seekCompare(SCRIPT_BEFORE.length); return; }
  if (a === 'watch'){ startTabPlayer(kind, true); return; }
  if (a === 'try'){ tryYourself(kind); return; }
  if (a === 'pause'){ const p = APP.players[kind]; if (!p) return; APP.paused = !APP.paused; APP.paused ? p.pause() : p.resume(); updatePanel(kind); }
});
// live time readouts without re-rendering the phones
setInterval(() => {
  Object.values(APP.phones).forEach(ph => ph.root.querySelectorAll('[data-m="time"]').forEach(n => n.textContent = fmtTime(ph.elapsed())));
  if (APP.tab === 'compare') updTimeline();
  if (APP.tab === 'compare') ['cb', 'ca'].forEach(k => { const ph = APP.phones[k], el = document.getElementById('met-' + k); if (ph && el){ el.querySelectorAll('[data-m="time"]').forEach(n => n.textContent = fmtTime(ph.elapsed())); el.querySelectorAll('[data-m="taps"]').forEach(n => n.textContent = ph.m.taps); } });
  else { const ph = APP.phones[APP.tab], p = document.getElementById('panel'); if (ph && p){ p.querySelectorAll('[data-m="time"]').forEach(n => n.textContent = fmtTime(ph.elapsed())); p.querySelectorAll('[data-m="taps"]').forEach(n => n.textContent = ph.m.taps); if (!ph.m.scripted && ph.m.start) APP.manual[APP.tab] = snapshot(ph); } }
}, 250);

mount();
</script>
