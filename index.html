:root{
  color-scheme:light only;
  --orange:#FC8019; --orange-ink:#B4510A; --orange-soft:#FFF1E6;
  --ink:#02060C; --ink-2:#2B2E33; --muted:#5D6066; --line:#E2E2E7;
  --bg:#F0F0F5; --violet:#5B3CDB; --violet-line:#DCD3FB;
  --green:#108A5C; --green-soft:#E6F5EE; --green-line:#A6D9C1; --star:#0F8A54;
  --amber:#8A4B00; --amber-soft:#FFF3DC; --amber-line:#F2C46D;
  --red:#B42318; --red-soft:#FDECEA;
  --obs:#1D4ED8; --obs-soft:#E8EEFE; --hyp:#7A3E00; --hyp-soft:#FFF0D6;
  --pro:#0F7A4F; --pro-soft:#E3F4EC; --cav:#4B4B57; --cav-soft:#EDEDF2;
  --focus:#1D4ED8;
  --font: "Jakarta", "Segoe UI Variable Display", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E6E6EC;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- page chrome ---------- */
.site-head{max-width:1180px;margin:0 auto;padding:22px 20px 10px;display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.eyebrow{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-ink);font-weight:700}
.site-head h1{margin:0;font-size:28px;letter-spacing:-.025em;font-weight:800}
.problem{margin:6px 0 0;max-width:640px;color:var(--ink-2)}
.head-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;min-height:40px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.btn-ghost{border:1px solid #C9C9D3;background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn-ghost:hover{border-color:var(--ink)}
.btn-ghost svg{width:16px;height:16px}
#stage{max-width:1180px;margin:0 auto;padding:6px 20px 24px}
#stage.wide{max-width:1440px}
footer{text-align:center;padding:12px 20px 32px;color:var(--muted);font-size:13px}
footer span{display:inline-block;border:1px solid #D0D0DA;background:#fff;border-radius:999px;padding:6px 12px}

/* ---------- phone frame ---------- */
.phone{--pw:390px;--ph:844px;width:var(--pw);height:var(--ph);background:#fff;border:10px solid #121216;border-radius:50px;overflow:hidden;position:relative;box-shadow:0 30px 60px -22px rgba(20,20,40,.4);isolation:isolate}
.phone.sm{--pw:372px;--ph:720px}
.screen-host{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.statusbar{flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:14px;font-weight:600;background:inherit}
.statusbar svg{height:12px;width:auto}
.sb-r{display:flex;gap:6px;align-items:center;font-size:13px}
.navbar{flex:none;height:30px;display:flex;justify-content:space-around;align-items:center;background:#fff;color:#55575C}
.navbar span{width:16px;height:16px;border:2px solid currentColor;border-radius:50%}
.navbar span:first-child{border-radius:0;border-width:0 0 2px 2px;transform:rotate(45deg);width:11px;height:11px}
.navbar span:last-child{border-radius:2px;border-width:2px 0;height:12px;width:18px;box-shadow:inset 0 5px 0 -3px currentColor}

/* finger overlay */
.fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.finger{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transform:translate(180px,700px);transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .25s}
.finger.on{opacity:1}
.finger svg{position:absolute;left:-10px;top:-2px;width:26px;height:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transform-origin:10px 2px;transition:transform .12s ease-out}
.finger .ring{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:2px solid rgba(252,128,25,.95);background:rgba(252,128,25,.16);opacity:0}
.finger.press svg{transform:scale(.86)}
.finger.press .ring{animation:ripple .5s ease-out}
@keyframes ripple{0%{opacity:1;transform:scale(.35)}100%{opacity:0;transform:scale(1.5)}}
.spot{position:relative;z-index:3;outline:2.5px solid var(--orange)!important;outline-offset:3px;animation:spot 1s ease-out infinite}
@keyframes spot{0%{box-shadow:0 0 0 0 rgba(252,128,25,.55)}100%{box-shadow:0 0 0 16px rgba(252,128,25,0)}}
/* pain / milestone rails beside the compare phones */
.phone-wrap{position:relative}
.rail{list-style:none;margin:0;padding:0;position:absolute;top:84px;width:168px;display:flex;flex-direction:column;gap:10px}
.rail.pain{right:calc(100% + 16px);align-items:flex-end}
.rail.win{left:calc(100% + 16px);align-items:flex-start}
.rail li{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600;line-height:1.25;box-shadow:0 6px 16px -8px rgba(0,0,0,.25);animation:railin .5s cubic-bezier(.2,.8,.2,1);transition:opacity .4s}
.rail.pain li{border:1px solid #F1C6C0;color:#7A1F16}
.rail.win li{border:1px solid #B5DDC8;color:#0B5E3E}
.rail .ix{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.rail.pain .ix{background:#FDECEA;color:#B42318}
.rail.win .ix{background:#E6F5EE;color:#108A5C}
.rail li:not(:last-child){opacity:.7}
@keyframes railin{from{opacity:0;transform:translateY(10px) scale(.94)}}
.mmh{padding:6px 12px 6px 10px}
.mmh .tt{flex:1;display:flex;flex-direction:column;line-height:1.2}
.mmh .tt b{font-size:19px;font-weight:800}
.mmh .tt small{font-size:13px;color:#6A6D73;font-weight:500}
.edit-pill{border:0;background:#FFF1E6;color:var(--orange-ink);font-weight:800;font-size:14px;border-radius:12px;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.edit-pill svg{width:15px;height:15px}
.dishbar{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:6px 14px 4px;background:#fff}
.dishbar::-webkit-scrollbar{display:none}
.dchip{flex:none;display:inline-flex;align-items:center;gap:8px;border:1.5px solid #D9DAE0;background:#fff;border-radius:999px;padding:0 13px 0 11px;min-height:38px;font-size:14px;font-weight:700;color:#3A3D42;transition:background .2s,border-color .2s,color .2s}
.dchip .o{width:12px;height:12px;border-radius:50%;border:2px solid #A9ABB2;transition:all .2s}
.dchip[aria-pressed="true"]{background:#FFF1E6;border-color:#F5A25D;color:#A84A08}
.dchip[aria-pressed="true"] .o{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 3px #FFD9BC}
.dchip.add{color:var(--orange-ink);border-style:dashed;border-color:#F0B98C}
.dhint{flex:none;margin:0;padding:4px 16px 10px;background:#fff;font-size:12px;color:#6A6D73}
.dhint b{color:#A84A08}
.badge.opt{background:#F2F2F6;color:#3A3D42;border:1.5px solid #E1E1E7;font-weight:700}
.mm-search{position:relative;z-index:16;padding-top:2px}
.ac.drop{position:absolute;left:-1.5px;right:-1.5px;top:calc(100% + 6px);margin:0;background:#fff;box-shadow:0 14px 30px -10px rgba(0,0,0,.3);z-index:20}
.mm-msg{flex:none;margin:0;padding:0 16px 6px;background:#fff;font-size:12.5px;color:#2B2E33;min-height:0}
.mm-msg:empty{display:none}
.dchip .o{display:grid;place-items:center}

.demo-callout p{margin:0 0 10px;font-size:14px}
.found-flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(16,138,92,.6)}100%{box-shadow:0 0 0 18px rgba(16,138,92,0)}}

/* after: builder */
.builder{background:#fff;border-radius:24px;margin:12px;padding:18px}
.builder h3{margin:0;font-size:20px;font-weight:800}
.builder .sub{margin:4px 0 12px;color:#5D6066;font-size:15px}
.counter{font-size:13px;font-weight:800;color:#2B2E33;background:var(--bg);border-radius:8px;padding:5px 9px;display:inline-block;white-space:nowrap}
.meal-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.meal-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1.5px solid #E4E4EA;border-radius:16px;padding:8px 6px 8px 10px;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:.3}100%{transform:none;opacity:1}}
.meal-row .art{width:44px;height:44px;border-radius:12px;flex:none}
.meal-row .nm{flex:1 1 120px;font-weight:700;min-width:120px;font-size:16px}
.meal-row .rq{order:4;margin-left:52px}
.rq{display:inline-flex;border:1.5px solid #D9DAE0;border-radius:12px;overflow:hidden;flex:none}
.rq button{border:0;background:#fff;padding:0 9px;min-height:36px;font-size:13px;font-weight:700;color:#5D6066}
.rq button[aria-pressed="true"].req{background:var(--ink);color:#fff}
.rq button[aria-pressed="true"].opt{background:#E6E6EC;color:var(--ink)}
.add-row{margin-top:16px}
.add-row label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.add-row .sbox{min-height:50px}
.add-row .sbox input{font-size:17px;padding:10px 0}
.ac{list-style:none;margin:8px 0 0;padding:0;border:1.5px solid #E4E4EA;border-radius:14px;overflow:hidden}
.ac:empty{display:none}
.ac li+li{border-top:1px solid #EEE}
.ac button{width:100%;text-align:left;border:0;background:#fff;padding:10px 14px;min-height:48px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:16px}
.ac button:hover,.ac button.hl{background:#FFF5EE}
.ac .in{font-size:13px;color:#5D6066}
.ac .in.dup{color:var(--amber);font-weight:700}
.ac-msg{font-size:14px;margin-top:8px;color:#2B2E33;min-height:18px}
.preview{margin-top:14px;font-size:15px;color:#2B2E33}
.btn-primary{width:100%;border:0;background:var(--orange-ink);color:#fff;font-weight:800;border-radius:14px;min-height:54px;margin-top:14px;font-size:17px}
.btn-primary:hover{background:#9A4408}
.btn-primary[disabled]{background:#B9B9C3;cursor:not-allowed}
.btn-sec{border:1.5px solid var(--orange-ink);background:#fff;color:var(--orange-ink);font-weight:800;border-radius:12px;min-height:46px;padding:8px 14px;font-size:15px}
.btn-sec:hover{background:#FFF5EE}

/* after: results */
.mstrip{flex:none;background:#fff;padding:2px 14px 12px}
.mstrip .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mchip{border:1.5px solid #D9DAE0;background:#fff;border-radius:999px;padding:0 12px;font-size:14px;min-height:38px;display:inline-flex;gap:6px;align-items:center;font-weight:600}
.mchip.req{border-color:var(--ink)}
.mchip small{font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#6A6D73}
.mchip.req small{color:var(--ink)}
.link-btn{border:0;background:transparent;color:var(--orange-ink);font-weight:800;min-height:40px;padding:0 6px;font-size:15px}
.tier-h{margin:18px 18px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tier-h h3{margin:0;font-size:21px;font-weight:700;color:#2B2E33}
.tier-h span{font-size:13px;color:#5D6066;text-align:right}
.tier-h:focus{outline:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;border-radius:10px;padding:5px 10px}
.badge.full{background:var(--green-soft);color:var(--green);border:1.5px solid var(--green-line)}
.badge.part{background:var(--amber-soft);color:var(--amber);border:1.5px solid var(--amber-line)}
.badge-row{padding:12px 22px 0}
.dstat{list-style:none;margin:12px 22px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.dstat li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;font-size:16px}
.st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;margin-top:1px;flex:none}
.st.ok{background:var(--green-soft);color:var(--green)}
.st.no{background:var(--red-soft);color:var(--red)}
.st.na{background:var(--amber-soft);color:var(--amber)}
.st.opt{background:#EDEDF2;color:#5D6066}
.dn b{font-weight:700}
.dn small{display:block;color:#5D6066;font-size:13.5px}
.dp{font-weight:700;font-variant-numeric:tabular-nums}
.optline{margin:8px 22px 0;font-size:14px;color:#5D6066}
.subtot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 22px 0;padding-top:12px;border-top:1px dashed #D0D1D6;font-size:15px}
.subtot b{font-size:19px}
.subtot small{display:block;color:#5D6066;font-size:12.5px}
.cta{display:block;width:calc(100% - 44px);margin:14px 22px 0;border:1.5px solid var(--orange-ink);background:#fff;color:var(--orange-ink);font-weight:800;border-radius:14px;min-height:50px;font-size:16px}
.cta:hover{background:#FFF5EE}
.hidden-note{margin:4px 18px 24px;font-size:14px;color:#5D6066}
.empty{background:#fff;border-radius:24px;margin:12px;padding:18px;border:1.5px solid var(--amber-line)}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0 0 12px;color:#2B2E33;font-size:15px}
.empty .actions{display:flex;flex-direction:column;gap:8px}
.skel{background:#fff;border-radius:28px;margin:0 0 16px;padding:22px}
.sk{background:linear-gradient(90deg,#ECECF1 0%,#F7F7FA 50%,#ECECF1 100%);background-size:200% 100%;animation:sh 1.1s linear infinite;border-radius:8px;height:16px;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.matches-for{font-size:12.5px;font-weight:800;color:var(--green);background:var(--green-soft);border-radius:6px;padding:3px 7px;display:inline-block;margin-top:6px;width:max-content}
.matches-for.optl{color:#5D6066;background:#EDEDF2}
.variants{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.variants button{border:1.5px solid #D9DAE0;background:#fff;border-radius:10px;font-size:13.5px;padding:4px 9px;min-height:36px;font-weight:600}
.variants button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.miss{margin:0 18px;padding:14px 2px;border-bottom:1px dashed #D6D7DC;font-size:15px;color:#2B2E33;display:flex;gap:10px;align-items:center}
.sec-h{margin:0;padding:20px 20px 4px;font-size:20px;font-weight:800;background:#fff}
.sec-sub{margin:0;padding:0 20px 6px;color:#5D6066;font-size:14px;background:#fff}

/* modal, toast */
.overlay{position:absolute;inset:0;background:rgba(18,18,24,.55);display:flex;align-items:flex-end;z-index:20;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;border-radius:28px 28px 0 0;padding:22px 18px 20px;width:100%;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.sheet h3{margin:0 0 6px;font-size:21px}
.sheet p{margin:0 0 12px;color:#2B2E33;font-size:15px}
.sheet .alt{border:1.5px solid var(--green-line);background:var(--green-soft);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.toast{position:absolute;left:14px;right:14px;bottom:90px;background:#24242C;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;z-index:25;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:up .25s}

/* cart */
.cart-card{background:#fff;border-radius:24px;margin:12px;padding:18px}
.cart-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #EEE}
.cart-line .stepper{margin-top:0;width:104px}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15px}
.checks li{display:flex;gap:10px;align-items:center}
.warn{background:var(--amber-soft);border:1.5px solid var(--amber-line);color:var(--amber);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:12px}
.okbox{background:var(--green-soft);border:1.5px solid var(--green-line);color:var(--green);border-radius:14px;padding:12px;font-size:15px;margin-top:12px;animation:pop .4s}

/* ---------- side panel ---------- */
.stage-grid{display:grid;grid-template-columns:auto minmax(300px,380px);gap:32px;justify-content:center;align-items:start}
.panel{background:#fff;border-radius:22px;padding:20px;border:1px solid var(--line);position:sticky;top:14px}
.panel h2{margin:0 0 2px;font-size:18px}
.step-sub{margin:0 0 12px;color:#5D6066;font-size:13px}
.pctl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.tag.obs{background:var(--obs-soft);color:var(--obs)} .tag.hyp{background:var(--hyp-soft);color:var(--hyp)}
.tag.pro{background:var(--pro-soft);color:var(--pro)} .tag.cav{background:var(--cav-soft);color:var(--cav)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.note{border-radius:12px;padding:10px 12px;border:1px solid var(--line);animation:pop .3s ease-out}
.note.obs{border-color:#C3D3FB;background:#F7F9FF} .note.hyp{border-color:#F1D3A0;background:#FFFBF3}
.note.pro{border-color:#B6DEC9;background:#F6FCF9} .note.cav{border-color:#DADAE2;background:#FAFAFC}
.note p{margin:6px 0 0;font-size:14px;color:#2B2E33}
.metrics{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.metrics h3{margin:0 0 8px;font-size:13px;color:#5D6066;font-weight:600}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--bg);border-radius:12px;padding:8px 10px}
.metric b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:#5D6066}

/* ---------- compare ---------- */
.cmp-top{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 10px;margin-bottom:12px}
.cmp-top .ib{width:36px;height:36px;border-radius:50%;border:1px solid #D0D0DA;background:#fff;display:grid;place-items:center;flex:none;padding:0}
.cmp-top .ib:hover{border-color:var(--ink)}
.cmp-top .ib svg{width:15px;height:15px}
.cmp-top .seg{padding:3px}
.cmp-top .seg button{min-height:30px;padding:2px 10px;font-size:13px}
.tlw{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:0 6px}
.tlw #phase{margin:0;font-size:12.5px;color:#2B2E33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row{display:flex;align-items:center;gap:10px}
.tl-bar{position:relative;flex:1;display:flex;gap:2px;height:16px;align-items:center;cursor:pointer;touch-action:none;outline-offset:4px}
.tl-bar .sg{position:relative;height:5px;background:#E1E1E8;border-radius:3px;overflow:hidden;transition:height .12s}
.tl-bar:hover .sg,.tl-bar.drag .sg{height:8px}
.tl-bar .sg i{position:absolute;left:0;top:0;bottom:0;width:0;background:#6E7077}
.tl-bar .sg.a i{background:var(--orange)}
.tl-bar .sg.first{margin-left:10px}
.tl-bar .sg.hov{background:#C9C9D3}
.tl-knob{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px #fff,0 1px 5px rgba(0,0,0,.35);pointer-events:none}
.tl-tip{position:absolute;bottom:22px;left:0;transform:translateX(-50%);background:#16161C;color:#fff;font-size:12px;font-weight:500;border-radius:8px;padding:6px 9px;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .12s;z-index:30}
.tl-tip b{color:#FFB37A;margin-right:6px;font-weight:700}
.tl-bar:hover .tl-tip,.tl-bar.drag .tl-tip{opacity:1}
.tl-time{font-size:12px;font-variant-numeric:tabular-nums;color:#5D6066;flex:none}
.compare-phones{display:flex;gap:28px;justify-content:center;align-items:flex-start}
.cmp-col{display:flex;gap:14px;align-items:flex-start;--cw:100%}
.cmp-info{width:236px;flex:none;display:flex;flex-direction:column;gap:10px}
.cmp-info .cmp-lbl{margin:2px 0 0!important;font-size:17px!important}
.cmp-info .caption{margin:0;max-width:none;min-height:0}
.cmp-info .cmp-met{width:100%!important;margin:0!important;padding:0!important}
.cmp-info .statcard{width:100%;margin:0;padding:12px}
.cmp-info .statcard .g3{gap:6px}
.cmp-info .statcard .g3 div{padding:7px 8px}
.cmp-info .statcard .g3 b,.cmp-info .metric b{font-size:19px}
.rail.inl{position:static!important;width:auto!important;margin:0!important;flex-direction:column!important;align-items:stretch!important;gap:7px;max-width:none!important}
.rail.inl li{border-radius:12px}
@media (max-width:900px){
  .compare-phones{flex-direction:column;align-items:center;gap:30px}
  .cmp-col{flex-direction:column;align-items:center;width:100%}
  .cmp-info{width:min(100%,520px);padding:0 16px}
  .rail.inl{flex-direction:row!important;flex-wrap:wrap}
}
.cmp-lbl{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:18px;font-weight:800}
.cmp-lbl .pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 8px}
.pill.today{background:#E3E3EA;color:#3F3F4A}
.pill.mm{background:#FFE6D2;color:#8F3F06}
.cmp-met{width:var(--cw);margin-top:10px}
.cmp-met .metric{background:#fff;border:1px solid var(--line)}
.done-badge{margin-top:10px;width:var(--cw);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;background:var(--green-soft);color:var(--green);border:1.5px solid var(--green-line);animation:pop .4s}
.summary{margin:26px auto 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;animation:pop .4s}
.summary h2{margin:0 0 8px;font-size:19px}
.summary p{margin:0;color:#2B2E33}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sum-card{border-radius:14px;padding:12px 14px;background:var(--bg)}
.sum-card b{font-size:15px}
.sum-card ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:#2B2E33}
.cmp-table-wrap{margin-top:24px;background:#fff;border-radius:20px;border:1px solid var(--line);overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;min-width:640px}
.cmp th,.cmp td{padding:14px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:14px}
.cmp thead th{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:#5D6066;background:#FAFAFC}
.cmp tbody th{font-weight:700;width:26%}
.cmp td.after{background:#FBFEFC}
.cmp tr.run td,.cmp tr.run th{background:#F4F6FD}
.run-lbl{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#4A5A8C;border:1.5px dashed #9AA6C8;border-radius:6px;padding:1px 6px;margin-bottom:4px}
.cmp-foot{margin:12px 2px 0;color:#5D6066;font-size:13px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .stage-grid{grid-template-columns:1fr;gap:16px;justify-items:center}
  .panel{position:static;width:100%;max-width:520px}
  .compare-phones{grid-template-columns:1fr;gap:36px}
  .sum-grid{grid-template-columns:1fr}
}
@media (max-width:600px){
  .site-head{padding:14px 16px 10px;gap:12px}
  .site-head h1{font-size:21px}
  .problem{font-size:14px}
  .head-controls{width:100%}
  .head-controls .seg{flex:1}
  .head-controls .seg button{flex:1;padding:8px 6px}
  #stage{padding:0 0 16px}
  .stage-grid > div:first-child{width:100%}
  .phone,.phone.sm{--pw:100%;--ph:min(100svh,800px);border-width:0;border-radius:0;box-shadow:none}
  .caption{margin:10px 16px 0;max-width:none}
  .panel{margin:0 16px;width:auto}
  .cmp-top{margin:0 16px 16px}
  .cmp-col{width:100%;--cw:100%}
  .cmp-col .phone{--ph:720px}
  .cmp-met{padding:0 16px}
  .done-badge{width:calc(100% - 32px)}
  .summary,.cmp-table-wrap{margin-left:16px;margin-right:16px}
  .cmp-foot{margin:12px 16px 0}
}
@media (prefers-reduced-motion:reduce){
  .finger{transition:none}
  .sk,.ph-rot span{animation:none}
  .meal-row,.note,.sheet,.overlay,.toast,.done-badge,.summary,.cartbar,.okbox,.found-flash{animation:none}
}
</style>

function buildData(){

/* =========================================================
   MATCHER
   ========================================================= */
function itemsFor(r, dishId){ const out = []; r.menu.forEach(c => c.items.forEach(it => { if (it.dish === dishId) out.push(it); })); return out; }
function matchRestaurant(r, meal){
  meal = meal.filter(m => m.req);   // only selected dishes take part in the match
  const rows = meal.map(m => {
    const its = itemsFor(r, m.id);
    const avail = its.filter(i => i.avail).sort((a, b) => a.p - b.p);
    return {dish:m.id, req:m.req, status: avail.length ? 'ok' : (its.length ? 'na' : 'no'), item: avail[0] || its[0] || null};
  });
  const req = rows.filter(x => x.req), opt = rows.filter(x => !x.req);
  const reqTotal = req.length, reqAvail = req.filter(x => x.status === 'ok').length, optFound = opt.filter(x => x.status === 'ok').length;
  const subtotal = rows.filter(x => x.status === 'ok').reduce((s, x) => s + x.item.p, 0);
  let tier = 'hidden';
  if (reqTotal === 0) tier = optFound ? 'complete' : 'hidden';
  else if (reqAvail === reqTotal) tier = 'complete';
  else if (reqAvail > 0) tier = 'partial';
  return {r, rows, reqTotal, reqAvail, optFound, subtotal, tier, score: reqAvail * 100 + optFound * 10 - r.eta * 0.5};
}
const SORTS = {
  best:{label:'Best match', fn:(a, b) => b.score - a.score},
  fastest:{label:'Fastest', fn:(a, b) => a.r.eta - b.r.eta},
  nearest:{label:'Nearest', fn:(a, b) => a.r.dist - b.r.dist},
  price:{label:'Lowest price', fn:(a, b) => a.subtotal - b.subtotal}
};
function matchAll(meal, sort, data){
  const all = data.list.map(r => matchRestaurant(r, meal));
  const by = t => all.filter(m => m.tier === t).sort((a, b) => SORTS[sort].fn(a, b) || a.r.eta - b.r.eta || a.r.id.localeCompare(b.r.id));
  return {complete:by('complete'), partial:by('partial'), hidden:by('hidden')};
}

  brownie: () => bgWood() + plate(70, 68, 54, 36) + `<path d="M44 60 L88 50 L104 66 L60 78z" fill="#4A2616"/><path d="M44 60 L88 50 L104 66 L60 78z" fill="url(#g-brownie)" transform="translate(0,-8)"/><path d="M50 52 L86 44" stroke="rgba(255,255,255,.15)" stroke-width="2"/>` + garnish([[64,52,'#C9A27A'],[78,56,'#C9A27A'],[70,47,'#C9A27A']]),
  dosa: () => bgLeaf() + `<path d="M10 72 Q70 46 132 58 L130 74 Q70 66 12 88z" fill="url(#g-dosa)"/><path d="M14 80 Q70 58 130 66" stroke="rgba(120,60,10,.35)" stroke-width="1.5" fill="none"/><ellipse cx="34" cy="38" rx="14" ry="9" fill="#F2EEDF"/><ellipse cx="62" cy="30" rx="13" ry="8" fill="url(#g-sambar)"/>`,
  neer: () => bgLeaf() + `<path d="M18 72 Q60 40 110 52 Q122 66 100 80 Q60 92 18 72z" fill="#FAF6EC"/><path d="M30 70 Q62 52 100 60" stroke="#E7DFCB" stroke-width="2" fill="none"/>`,
  idli: () => bgMat() + plate() + `<ellipse cx="54" cy="58" rx="20" ry="13" fill="#FBFAF4"/><ellipse cx="54" cy="56" rx="17" ry="9" fill="#FFFFFF"/><ellipse cx="86" cy="66" rx="20" ry="13" fill="#FBFAF4"/><ellipse cx="86" cy="64" rx="17" ry="9" fill="#FFFFFF"/><ellipse cx="96" cy="42" rx="12" ry="8" fill="#E9F0D4"/>`,
  coffee: () => bgWood() + shadow(74, 92, 40, 12) + `<ellipse cx="70" cy="86" rx="40" ry="12" fill="url(#g-steel)"/><path d="M52 34 L56 84 L84 84 L88 34z" fill="url(#g-steel)"/><ellipse cx="70" cy="34" rx="18" ry="6" fill="url(#g-coffee)"/><ellipse cx="70" cy="34" rx="12" ry="3.5" fill="#E8C9A2" opacity=".8"/>`,
  coldcoffee: () => bgWood() + shadow(72, 98, 26, 8) + `<path d="M48 22 L54 96 L86 96 L92 22z" fill="#C49A73"/><path d="M48 22 L50 40 L90 40 L92 22z" fill="#F4E8D6"/><path d="M56 26 L58 92" stroke="rgba(255,255,255,.45)" stroke-width="3"/>`,
  puri: () => bgMat() + plate() + [[48,54],[70,48],[92,56],[58,72],[82,74],[70,62]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="12" fill="url(#g-puri)"/><circle cx="${x - 3}" cy="${y - 4}" r="3" fill="rgba(255,240,200,.6)"/>`).join(''),
  pavbhaji: () => bgWood() + plate(70, 64, 60, 42) + `<ellipse cx="58" cy="60" rx="30" ry="20" fill="url(#g-bhaji)"/><rect x="82" y="50" width="30" height="22" rx="8" fill="url(#g-bun)"/><rect x="86" y="68" width="30" height="20" rx="8" fill="url(#g-bun)"/>` + garnish([[50,56],[62,64],[56,52,'#F3E7C2'],[66,54,'#F3E7C2']]),
  jamun: () => bgWood() + steelBowl(70, 66, 50, 34) + `<ellipse cx="70" cy="66" rx="42" ry="27" fill="#C88A2E" opacity=".85"/>` + [[56,62],[84,62],[70,72]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="13" fill="url(#g-jamun)"/><circle cx="${x - 4}" cy="${y - 5}" r="3" fill="rgba(255,220,180,.5)"/>`).join(''),
  rasmalai: () => bgWood() + steelBowl(70, 66, 50, 34) + `<ellipse cx="70" cy="66" rx="42" ry="27" fill="#F4DE92"/>` + [[56,62],[84,64],[70,74]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="13" ry="9" fill="url(#g-malai)"/>`).join('') + garnish([[62,58,'#6BA34A'],[78,70,'#6BA34A'],[70,60,'#E0A22B']]),
  rice: () => bgMat() + steelBowl() + `<ellipse cx="70" cy="60" rx="40" ry="26" fill="url(#g-rice)"/>` + garnish([[58,52,'#F3E2B8'],[76,48,'#F3E2B8'],[84,62],[62,66]]),
  yrice: () => bgMat() + plate() + `<ellipse cx="70" cy="60" rx="40" ry="24" fill="url(#g-yrice)"/>` + garnish([[58,52],[76,48,'#B52A20'],[84,62],[62,66,'#5C3A1A']]),
  kesari: () => bgMat() + plate() + `<path d="M40 70 Q70 30 100 70z" fill="url(#g-kesari)"/>` + garnish([[60,58,'#F3E2B8'],[76,52,'#F3E2B8'],[70,62,'#6A3F1F']]),
  sandwich: () => bgSlate() + plate(70, 66, 58, 40) + `<path d="M28 74 L74 40 L76 84z" fill="url(#g-bread)"/><path d="M66 82 L112 50 L114 90z" fill="url(#g-bread)"/>` + [0,1,2,3].map(i => `<path d="M${34 + i * 10} ${70 - i * 7} l8 10" stroke="#7A4515" stroke-width="2"/>`).join('') + `<path d="M74 40 L76 84" stroke="#F2D27A" stroke-width="3"/><ellipse cx="34" cy="40" rx="11" ry="7" fill="#3C8A35"/>`,

};
const svgArt = kind => `<svg viewBox="0 0 140 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${(ART[kind] || ART.generic)()}</svg>`;
const art = kind => `<span class="art" aria-hidden="true">${svgArt(kind)}</span>`;
const artOf = it => it.art || (DISH[it.dish] || {}).art || 'generic';
const STAR = '<span class="star" aria-hidden="true">★</span>';

/* =========================================================
   PHONE: one interactive phone, Before or After
   ========================================================= */
class Phone {
  constructor(host, kind, opts = {}){
    this.kind = kind; this.opts = opts;
    host.innerHTML = `<div class="phone ${opts.small ? 'sm' : ''}" role="region" aria-label="${kind === 'before' ? 'Phone: Swiggy today' : 'Phone: Swiggy with Meal Match'}"><div class="screen-host"></div><div class="fx" aria-hidden="true"><div class="finger"><span class="ring"></span><svg viewBox="0 0 24 28" aria-hidden="true"><path d="M9 1.5c1.1 0 2 .9 2 2V12l.6-.1c.3-1 1.1-1.6 2-1.6 1 0 1.8.6 2 1.5.4-.5 1-.8 1.7-.8 1.1 0 2 .8 2.1 1.9.3-.2.7-.3 1.1-.3 1.1 0 2 .9 2 2v5.4c0 4.4-3.1 7.5-7.5 7.5h-1.6c-2.4 0-4.1-.9-5.6-2.8L2.6 17c-.7-.9-.6-2.2.3-2.9.9-.7 2.1-.6 2.8.2L7 15.8V3.5c0-1.1.9-2 2-2z" fill="#fff" stroke="#16161C" stroke-width="1.5" stroke-linejoin="round"/><path d="M11 12v4.5M15.6 11.8v4.7M19.4 12.5v4" stroke="#16161C" stroke-width="1.2" stroke-linecap="round"/></svg></div></div></div>`;
    this.root = host.querySelector('.phone');
    this.sh = this.root.querySelector('.screen-host');
    this.finger = this.root.querySelector('.finger');
    this.player = null; this.timers = [];
    this.reset();
    this.root.addEventListener('click', e => this.onClick(e));
    this.root.addEventListener('submit', e => this.onSubmit(e));
    this.root.addEventListener('input', e => this.onInput(e));
    this.root.addEventListener('keydown', e => this.onKey(e));
  }
  reset(){
    this.timers.forEach(clearTimeout); this.timers = [];
    this.data = buildData();
    this.m = {taps:0, start:null, end:null, virt:0, scripted:false};
    this.scrollMem = {}; this.lastKey = null; this.toast = null; this.fast = false;
    this.finger.classList.remove('on', 'press', 'drag');
    this.st = this.kind === 'before'
      ? {screen:'search', query:'', tab:'dishes', menuRid:null, opened:[], collapsed:{}, found:null, cart:{rid:null, lines:{}}, chips:{}}
      : {screen:'search', meal: this.opts.meal ? this.opts.meal.map(x => ({...x})) : DEFAULT_MEAL(), sort:'best', loading:false, detailRid:null,
         cart:{rid:null, lines:{}}, variant:{}, opened:[], flipped:false, modal:null, acQuery:'', acMsg:'', acHl:0, checkout:null, focusPartial:false};
    this.render();
  }
  later(fn, ms){ this.timers.push(setTimeout(fn, ms)); }
  bubble(type, text, x, y){
    const fx = this.root.querySelector('.fx'); fx.querySelectorAll('.bubble').forEach(b => b.remove());
    const W = this.root.clientWidth, H = this.root.clientHeight, b = document.createElement('div');
    b.className = 'bubble ' + type; b.innerHTML = `<i>${LBL[type]}</i>${esc(text)}`; fx.appendChild(b);
    const bw = b.offsetWidth, bh = b.offsetHeight;
    let left = Math.max(10, Math.min(W - bw - 10, x - bw * 0.55)), top = y - bh - 26;
    if (top < 60) top = y + 34; if (top + bh > H - 40) top = H - bh - 40;
    b.style.left = left + 'px'; b.style.top = top + 'px';
    const t = setTimeout(() => { b.classList.add('out'); setTimeout(() => b.remove(), 400); }, 3000 / (APP.speed || 1));
    this.timers.push(t);
  }
  elapsed(){ if (!this.m.start) return 0; if (this.m.scripted) return this.m.virt; return (this.m.end || Date.now()) - this.m.start; }
  pages(){ return this.st.opened.length; }
  startClock(){ if (!this.m.start) this.m.start = Date.now(); }
  endClock(){ if (this.m.start && !this.m.end) this.m.end = Date.now(); }

  /* ---------- cart ---------- */
  cartCount(){ return Object.values(this.st.cart.lines).reduce((s, l) => s + l.qty, 0); }
  linePrice(l){ const it = this.data.items[l.itemId].it; return it.variants ? it.variants[l.vi][1] : it.p; }
  cartTotal(){ return Object.values(this.st.cart.lines).reduce((s, l) => s + l.qty * this.linePrice(l), 0); }
  qtyOf(id){ return Object.values(this.st.cart.lines).filter(l => l.itemId === id).reduce((s, l) => s + l.qty, 0); }
  price(it){ if (!it.variants) return it.p; const vi = this.kind === 'after' ? (this.st.variant[it.id] || 0) : 0; return it.variants[vi][1]; }
  addCtl(it){
    if (!it.avail) return `<button type="button" class="add-btn" disabled aria-label="${esc(it.n)} unavailable">ADD</button>`;
    const q = this.qtyOf(it.id);
    if (q) return `<div class="stepper" role="group" aria-label="${esc(it.n)} quantity"><button type="button" data-action="dec" data-item="${it.id}" data-fk="dec-${it.id}" aria-label="Remove one ${esc(it.n)}">−</button><span>${q}</span><button type="button" data-action="inc" data-item="${it.id}" data-fk="inc-${it.id}" aria-label="Add one more ${esc(it.n)}">+</button></div>`;
    return `<button type="button" class="add-btn" data-action="inc" data-item="${it.id}" data-fk="inc-${it.id}" aria-label="Add ${esc(it.n)}">ADD</button>`;
  }
  dishCard(it, extra = ''){
    return `<div class="dcard">
      <div class="t"><div style="display:flex;align-items:center"><span class="veg" role="img" aria-label="Veg"></span>${it.rt && it.rt[1] > 300 ? '<span class="bogo">Bestseller</span>' : ''}</div>
        <h4>${esc(it.n)}</h4>${extra}
        ${it.rt ? `<span class="rpill">★ ${it.rt[0]} (${it.rt[1]})</span>` : ''}
        ${it.avail ? '' : '<span class="unav">Unavailable right now</span>'}
        <div class="price">${rupee(this.price(it))}</div></div>
      <div class="dimg">${art(artOf(it))}${this.addCtl(it)}${it.custom ? '<div class="custom">Customisable</div>' : ''}</div></div>`;
  }
  menuItem(it, extra = ''){
    return `<div class="mitem ${it.avail ? '' : 'off'}">
      <div class="t"><span class="veg" role="img" aria-label="Veg"></span><h4>${esc(it.n)}</h4><div class="pr">${rupee(this.price(it))}</div>
        ${it.rt ? `<span class="rpill">★ ${it.rt[0]} (${it.rt[1]})</span>` : ''}
        ${it.avail ? '' : '<div class="unav">Unavailable right now</div>'}${extra}
        ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ''}</div>
      <div class="dimg">${art(artOf(it))}${this.addCtl(it)}${it.custom ? '<div class="custom">Customisable</div>' : ''}</div></div>`;
  }
  rmeta(r, km){ return `<div class="rmeta">${STAR}<span>${r.rating} (${r.reviews})</span><span aria-hidden="true">•</span><span>${r.eta}-${r.eta + 5} mins</span>${km ? `<span aria-hidden="true">•</span><span>${r.dist} km</span>` : ''}</div>`; }
  offers(r){ return `<div class="offline">${OFF_ICON}<span>${esc(r.offer)}</span></div>${r.free ? `<div class="offline">${FREE_ICON}<span>Free Delivery</span></div>` : ''}`; }

  /* ---------- search screen (shared look) ---------- */
  searchScreen(inputRow){
    return `<div class="screen">${STATUS}<div class="scroll" id="scroll">
      <div class="sheet-top">
        <div class="hdr"><button type="button" class="icon-btn" aria-label="Back" data-action="toast" data-msg="This is the first screen of the demo.">${IC.back}</button><div class="ttl">Search for dishes &amp; restaurants</div></div>
        ${inputRow}
        <div class="recent-lbl">RECENTLY SEARCHED RESTAURANTS</div>
        <div class="recent">${['Udupi Upahar Bhavan','Brew & Bake Café','Chaat Corner Junction','Namma Chaat & Tiffins','South Spice Express'].map(n => `<button type="button" class="rchip" data-action="toast" data-msg="Recent searches are decorative in this demo.">${IC.hist}<span>${esc(n)}</span></button>`).join('')}</div>
      </div>
      <div class="dim-feed" aria-hidden="true"><div class="home-tabs"><span>REORDER</span><span>FOOD IN 15 MINS</span></div>
        <div class="home-cards"><div class="hcard">${art('pavbhaji')}<b>Bombay Bites</b></div><div class="hcard">${art('dosa')}<b>South Spice</b></div><div class="hcard">${art('chaat')}</div></div></div>
    </div>${NAVBAR}</div>`;
  }
  rotPlaceholder(){ return '<span class="ph-rot" aria-hidden="true"><span>Try \'Sweets\'</span><span>Try \'Masala Dosa\'</span><span>Try \'Chaat\'</span></span>'; }

  /* ---------- BEFORE screens ---------- */
  beforeSearch(){
    return this.searchScreen(`<div class="srow" style="padding-top:10px">
      <div class="sbox"><input id="q-${this.uid()}" data-q="1" type="search" autocomplete="off" placeholder=" " value="${esc(this.st.query)}" aria-label="Search for dishes and restaurants">${this.rotPlaceholder()}
        <button type="button" class="icon-btn" aria-label="Search" data-action="b-search" data-fk="b-submit" style="width:40px">${IC.search}</button><span class="divider"></span>
        <button type="button" class="icon-btn mic" aria-label="Voice search" data-action="toast" data-msg="Voice search isn't part of this demo. Tap the box to pre-fill the query.">${IC.mic}</button></div></div>`);
  }
  uid(){ return this._uid || (this._uid = Math.random().toString(36).slice(2, 8)); }
  resultsHeader(q){
    const st = this.st;
    return `${STATUS}<div class="hdr"><button type="button" class="icon-btn" aria-label="Back to search" data-action="b-clear" data-fk="b-back1">${IC.back}</button><div class="ttl">Showing results in <b>Food</b><span class="caret" aria-hidden="true"></span></div></div>
      <div class="srow"><div class="sbox"><span class="val">${esc(q)}</span><button type="button" class="icon-btn" aria-label="Clear search" data-action="b-clear" data-fk="b-clear" style="width:40px">${IC.x}</button><span class="divider"></span><button type="button" class="icon-btn mic" aria-label="Voice search" data-action="toast" data-msg="Voice search isn't part of this demo.">${IC.mic}</button></div>
        <button type="button" class="vegbox" aria-pressed="true" aria-label="Veg only, on" data-action="toast" data-msg="Veg-only is on. All demo restaurants are pure veg.">VEG<span class="sw" aria-hidden="true"></span></button></div>
      <div class="tabs2" role="tablist"><button type="button" role="tab" aria-selected="${st.tab === 'restaurants'}" data-action="b-tab" data-tab="restaurants">Restaurants</button><button type="button" role="tab" aria-selected="${st.tab === 'dishes'}" data-action="b-tab" data-tab="dishes">Dishes</button></div>
      <div class="filters"><div class="frow">${this.fchip('Sort by', 'sort', IC.down)}<span class="fchip on">Veg Dishes ${IC.x}</span>${this.fchip('Rating 4.0+', 'rating')}${this.fchip('Fast Delivery', 'fast')}</div>
        <div class="frow">${['Spicy','Medhu','Masala','South Indian','Chaat'].map(c => this.fchip(c, c, '', 'vio')).join('')}</div></div>`;
  }
  fchip(label, key, icon = '', cls = ''){ return `<button type="button" class="fchip ${cls}" aria-pressed="${!!this.st.chips[key]}" data-action="b-chip" data-key="${esc(key)}">${esc(label)}${icon}</button>`; }
  shownItem(r){ for (const c of r.menu) for (const it of c.items) if (['sambar-vada','dahi-papdi-chaat'].includes(it.dish)) return it; return null; }
  beforeSection(r){
    return `<section class="rsec" aria-label="${esc(r.name)}"><div class="rhead"><div class="g"><p class="rnm">${esc(r.name)}</p>${this.rmeta(r)}${this.offers(r)}</div>
      <button type="button" class="icon-btn" aria-label="Open ${esc(r.name)} menu" data-action="b-open" data-rid="${r.id}" data-fk="b-open-${r.id}">${IC.arrow}</button></div>
      <div class="carousel">${this.dishCard(this.shownItem(r))}</div></section>`;
  }
  beforeResultsList(){
    const D = this.data.byId;
    if (this.st.tab === 'restaurants') return `<div class="feed">${[...FEATURED, ...MORE].map(id => { const r = D[id]; return `<button type="button" class="rsec" style="display:block;width:100%;text-align:left;border:0" data-action="b-open" data-rid="${r.id}"><div class="rhead"><div class="g"><p class="rnm">${esc(r.name)}</p>${this.rmeta(r, true)}<div class="offline">${esc(r.area)}</div></div><span class="icon-btn" aria-hidden="true">${IC.arrow}</span></div></button>`; }).join('')}</div>`;
    const hero = (r, rib, kind) => `<button type="button" class="hero" data-action="b-open" data-rid="${r.id}" data-fk="hero-${r.id}" aria-label="Sponsored: ${esc(r.name)}">${svgArt(kind)}<span class="shade"></span><span class="rib">${rib}</span><span class="ad">AD</span><span class="txt"><span class="nm">${esc(r.name)}</span><span class="mt">★ ${r.rating} • ${r.eta}-${r.eta + 5} mins · Pure Veg</span></span></button>`;
    return `<div class="feed"><div class="hero-row">${hero(D.r3, 'FREE DELIVERY', 'vada')}${hero(D.r4, 'Items @39', 'pavbhaji')}</div>
      <div class="lbl-line">FEATURED RESTAURANTS</div>${FEATURED.map(id => this.beforeSection(D[id])).join('')}
      <div class="more-h">Can we interest you in more options?</div>${MORE.map(id => this.beforeSection(D[id])).join('')}</div>`;
  }
  tracker(){ return `<div class="demo-strip"><span class="demo-label">Demo tracker</span><span>Menus opened <b>${this.pages()}</b></span><span>Time <b data-m="time">${fmtTime(this.elapsed())}</b></span></div>`; }
  beforeResults(){ return `<div class="screen">${this.resultsHeader(this.st.query)}${this.tracker()}<div class="scroll" id="scroll" style="background:var(--bg)">${this.beforeResultsList()}</div>${this.beforeCartBar()}${NAVBAR}</div>`; }
  beforeCartBar(){
    const n = this.cartCount(); if (!n) return '';
    return `<button type="button" class="cartbar" data-action="toast" data-msg="Checkout isn't part of the Before journey."><span>${plural(n, 'item', 'items')} added<small>from ${esc(this.data.byId[this.st.cart.rid].name)}</small></span><span class="r">View Cart ›</span></button>`;
  }
  restoTop(backAction, backLabel){
    return `<div style="background:var(--bg)">${STATUS}</div><div class="hdr" style="background:var(--bg)"><button type="button" class="icon-btn" aria-label="${backLabel}" data-action="${backAction}" data-fk="${backAction}">${IC.back}</button><span style="flex:1"></span>
      <button type="button" class="icon-btn" aria-label="Search menu" data-action="toast" data-msg="Menu search isn't part of this demo.">${IC.search}</button><button type="button" class="icon-btn" aria-label="More options" data-action="toast" data-msg="Not part of this demo.">${IC.more}</button></div>`;
  }
  restoInfo(r, badge = ''){
    return `<div class="rinfo"><p class="rnm">${esc(r.name)}</p>
      <div class="row">${STAR}<span>${r.rating} (${r.reviews} ratings)</span><span aria-hidden="true">•</span><span>₹${r.forTwo} for two</span></div>
      <div class="tl"><div class="dots" aria-hidden="true"><i></i><b></b><i></i></div><div class="lines"><span>Outlet <span>${esc(r.area)} ▾</span></span><span>${r.eta}-${r.eta + 5} mins <span>· ${r.dist} km</span></span></div></div>${badge}</div>
      <div class="offer-strip"><div class="offer-card">${OFF_ICON}<div><b>${esc(r.offer)}</b><small>No code required</small></div></div><div class="offer-card">${FREE_ICON}<div><b>${r.free ? 'Free delivery' : 'Flat ₹40 off'}</b><small>On orders above ₹199</small></div></div></div>`;

  beforeMenu(){
    const st = this.st, r = this.data.byId[st.menuRid], found = st.found === r.id;
